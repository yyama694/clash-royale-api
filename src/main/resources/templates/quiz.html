<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{quiz.title})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <!--/*
      クラロワクイズ(設計_クイズ.md)。はじめ・問題・結果の3つの画面を、ページを読み直さずにJSで切り替える。
      その日の30問はすべて #quiz-questions に埋めてあり、採点と成績の保存(localStorage の quiz)はブラウザだけで行う。
      数字の入る文言は {0} を文字のまま渡して受け取り、JSで置き換える。
    */-->
    <main class="container quiz" id="quiz" th:data-date="${quiz.date()}"
          th:data-msg-new="#{quiz.size.new}"
          th:data-msg-resume="#{quiz.size.resume('{0}', '{1}')}"
          th:data-msg-done="#{quiz.size.done('{0}', '{1}')}"
          th:data-msg-countdown="#{quiz.countdown('{0}')}"
          th:data-msg-new-day="#{quiz.newDay}"
          th:data-msg-progress="#{quiz.progress('{0}', '{1}')}"
          th:data-msg-correct="#{quiz.correct}"
          th:data-msg-wrong="#{quiz.wrong('{0}')}"
          th:data-msg-hp-wrong="#{quiz.hp.wrong('{0}')}"
          th:data-msg-next="#{quiz.next}"
          th:data-msg-to-result="#{quiz.toResult}"
          th:data-msg-quit="#{quiz.quit}"
          th:data-msg-quit-practice="#{quiz.quit.practice}"
          th:data-msg-score="#{quiz.result.score('{0}', '{1}')}"
          th:data-msg-wrong-item="#{quiz.result.wrong.item('{0}', '{1}')}"
          th:data-msg-wrong-order="#{quiz.result.wrong.order('{0}')}"
          th:data-msg-streak="#{quiz.stats.streak.value('{0}', '{1}')}">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToTop}"></span></a>

        <section class="card quiz-start" id="quiz-start">
            <h1 th:text="#{quiz.title}"></h1>
            <p class="quiz-round" th:text="${quiz.roundLabel()}"></p>
            <p class="quiz-lead" th:each="lead : ${quiz.leads()}" th:text="${lead}"></p>
            <div class="quiz-sizes">
                <button type="button" class="quiz-size" th:each="size : ${quiz.sizes()}" th:data-size="${size}">
                    <span class="quiz-size-count" th:text="#{quiz.size(${size})}"></span>
                    <span class="quiz-size-status"></span>
                </button>
            </div>
            <p class="notice" th:text="#{quiz.note}"></p>
            <p class="notice quiz-countdown"></p>
        </section>

        <section class="card quiz-play" id="quiz-play" hidden>
            <div class="quiz-play-head">
                <span class="quiz-progress-text"></span>
                <span class="quiz-practice" hidden th:text="#{quiz.practice}"></span>
            </div>
            <div class="quiz-progress" aria-hidden="true"><div class="quiz-progress-bar"></div></div>
            <figure class="quiz-card">
                <img class="quiz-card-image" width="285" height="420" alt="">
                <figcaption class="quiz-card-name"></figcaption>
            </figure>
            <p class="quiz-prompt"></p>
            <div class="quiz-choices"></div>
            <!--/* 並べ替え。並び順の番号(1〜4)はCSSのカウンターで振るので、行を動かしても位置の番号のまま。 */-->
            <div class="quiz-order" hidden>
                <p class="quiz-order-end" th:text="#{quiz.hp.more}"></p>
                <ol class="quiz-order-list"></ol>
                <p class="quiz-order-end" th:text="#{quiz.hp.less}"></p>
                <p class="notice quiz-order-howto" th:text="#{quiz.hp.howto}"></p>
            </div>
            <p class="quiz-feedback" aria-live="polite"></p>
            <p class="quiz-note" aria-live="polite" hidden></p>
            <div class="quiz-actions">
                <button type="button" class="quiz-submit" hidden th:text="#{quiz.hp.submit}"></button>
                <button type="button" class="quiz-next" hidden></button>
            </div>
            <button type="button" class="quiz-quit"></button>
        </section>

        <section class="card quiz-result" id="quiz-result" hidden>
            <h2 th:text="#{quiz.result.heading}"></h2>
            <p class="quiz-practice" hidden th:text="#{quiz.practice}"></p>
            <p class="quiz-score"></p>
            <p class="quiz-perfect" hidden th:text="#{quiz.result.perfect}"></p>
            <!--/* 正誤の並びは点数の文で伝わるので、読み上げでは飛ばす。 */-->
            <p class="quiz-grid" aria-hidden="true"></p>
            <div class="quiz-wrong">
                <h3 th:text="#{quiz.result.wrong.heading}"></h3>
                <ul class="quiz-wrong-list"></ul>
            </div>
            <div class="quiz-actions">
                <button type="button" class="btn-secondary quiz-retry" th:text="#{quiz.result.retry}"></button>
                <button type="button" class="quiz-back" th:text="#{quiz.result.back}"></button>
            </div>
        </section>

        <section class="card quiz-stats" id="quiz-stats">
            <h2 th:text="#{quiz.stats.heading}"></h2>
            <p><span th:text="#{quiz.stats.streak}"></span>: <strong class="quiz-streak"></strong></p>
            <table class="quiz-stats-table">
                <thead>
                <tr>
                    <th scope="col" th:text="#{quiz.stats.size}"></th>
                    <th scope="col" class="num" th:text="#{quiz.stats.plays}"></th>
                    <th scope="col" class="num" th:text="#{quiz.stats.average}"></th>
                    <th scope="col" class="num" th:text="#{quiz.stats.perfect}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="size : ${quiz.sizes()}" th:data-size="${size}">
                    <th scope="row" th:text="#{quiz.size(${size})}"></th>
                    <td class="num quiz-plays" th:data-label="#{quiz.stats.plays}"></td>
                    <td class="num quiz-average" th:data-label="#{quiz.stats.average}"></td>
                    <td class="num quiz-perfect-count" th:data-label="#{quiz.stats.perfect}"></td>
                </tr>
                </tbody>
            </table>
            <p class="notice quiz-stats-empty" hidden th:text="#{quiz.stats.empty}"></p>
            <p class="notice" th:text="#{quiz.stats.note}"></p>
        </section>

        <!--/* 1問に1つの li。中の span がカード(エリクサーは1枚、並べ替えは最初に見せる並びの4枚)。 */-->
        <ol id="quiz-questions" hidden>
            <li th:each="q : ${quiz.questions()}" th:data-key="${q.key()}" th:data-type="${q.type()}"
                th:data-prompt="${q.prompt()}" th:data-note="${q.note()}" th:data-choices="${q.choicesText()}"
                th:data-answer="${q.answer()}"
                th:data-choice-label="${!q.choices().isEmpty()} ? #{${'quiz.' + q.type() + '.choice'}('{0}')}"><span
                    th:each="card : ${q.cards()}" th:data-card="${card.id()}" th:data-name="${card.name()}"
                    th:data-icon="${card.iconUrl()}" th:data-link="@{/card/{id}(id=${card.id()})}"
                    th:data-value="${card.value()}"></span></li>
        </ol>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!--/*
      成績の保存(localStorage の quiz)。形は {v: 1, maxStreak, days: {"2026-10-26": {"10": 回}}}。
      回は問題数ごとの、その日の最初の1回(公式の成績)で、ids(出題した問題の key)・answers(答え)・終わったら marks("oox…")。
      答えはエリクサーなら選んだ位置(数)、並べ替えなら並べたカードの最初の並びでの位置("2031")で、正解と文字にして比べる。
      前の日以前の回は marks だけ残し、終わっていない回と400日より前の日は消す。
      2回目以降(練習)は保存しない。日付はページに埋めたUTCの日付で決め、端末の時計は使わない。
      別のタブが書いた分を消さないよう、書くたびに読み直してから書く。
    */-->
    <script>
        (function () {
            var root = document.getElementById('quiz');
            var today = root.dataset.date;
            var msg = root.dataset;
            var STORAGE_KEY = 'quiz';
            var KEEP_DAYS = 400;
            var DAY_MS = 24 * 60 * 60 * 1000;
            var GRID_COLUMNS = 10;
            // 並べ替えで、押してからこれだけ(px)動いたらドラッグにする。動かなければタップ(2枚目のタップで入れ替え)。
            var DRAG_THRESHOLD = 8;
            var questions = Array.prototype.map.call(document.querySelectorAll('#quiz-questions > li'), function (li) {
                return {
                    key: li.dataset.key,
                    type: li.dataset.type,
                    prompt: li.dataset.prompt,
                    note: li.dataset.note,
                    choices: li.dataset.choices ? li.dataset.choices.split(',') : [],
                    answer: li.dataset.answer,
                    choiceLabel: li.dataset.choiceLabel,
                    cards: Array.prototype.map.call(li.children, function (span) {
                        return {
                            id: Number(span.dataset.card),
                            name: span.dataset.name,
                            icon: span.dataset.icon,
                            link: span.dataset.link,
                            value: span.dataset.value
                        };
                    })
                };
            });
            var screens = {
                start: document.getElementById('quiz-start'),
                play: document.getElementById('quiz-play'),
                result: document.getElementById('quiz-result')
            };
            var stats = document.getElementById('quiz-stats');
            var orderList = screens.play.querySelector('.quiz-order-list');
            var current = 'start';
            var play = null;
            var drag = null;
            var store = load();

            function format(template, values) {
                return template.replace(/\{(\d)\}/g, function (all, index) {
                    return values[Number(index)];
                });
            }

            function dayNumber(day) {
                var parts = day.split('-');
                return Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])) / DAY_MS;
            }

            function dayString(number) {
                return new Date(number * DAY_MS).toISOString().slice(0, 10);
            }

            function load() {
                var data;
                try {
                    data = JSON.parse(localStorage.getItem(STORAGE_KEY));
                } catch (e) {
                    data = null;
                }
                if (!data || data.v !== 1 || typeof data.days !== 'object' || data.days === null) {
                    data = {v: 1, maxStreak: 0, days: {}};
                }
                prune(data);
                return data;
            }

            function prune(data) {
                var oldest = dayString(dayNumber(today) - KEEP_DAYS);
                Object.keys(data.days).forEach(function (day) {
                    var attempts = data.days[day];
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || day < oldest || typeof attempts !== 'object' || attempts === null) {
                        delete data.days[day];
                        return;
                    }
                    if (day === today) {
                        return;
                    }
                    Object.keys(attempts).forEach(function (size) {
                        if (attempts[size] && typeof attempts[size].marks === 'string') {
                            attempts[size] = {marks: attempts[size].marks};
                        } else {
                            delete attempts[size];
                        }
                    });
                    if (Object.keys(attempts).length === 0) {
                        delete data.days[day];
                    }
                });
            }

            function update(change) {
                store = load();
                change(store);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
                } catch (e) {
                    // プライベートモードなどで保存できなくても、遊ぶことはできるようにする。
                }
            }

            function idsOf(size) {
                return questions.slice(0, size).map(function (q) { return q.key; });
            }

            function sameIds(ids, size) {
                return Array.isArray(ids) && ids.join(',') === idsOf(size).join(',');
            }

            function isCorrect(q, answer) {
                return String(answer) === q.answer;
            }

            function marksOf(answers) {
                return answers.map(function (answer, i) {
                    return isCorrect(questions[i], answer) ? 'o' : 'x';
                }).join('');
            }

            function scoreOf(marks) {
                return marks.split('').filter(function (mark) { return mark === 'o'; }).length;
            }

            function orderNames(q, order) {
                return order.split('').map(function (index) {
                    return q.cards[Number(index)].name;
                }).join(' → ');
            }

            // その日の公式の成績。途中の回は、その日の途中で問題が変わっていたら(新しいカードの追加など)無かったことにする。
            function official(size) {
                var attempt = store.days[today] && store.days[today][size];
                if (!attempt) {
                    return null;
                }
                if (typeof attempt.marks === 'string') {
                    return attempt;
                }
                return sameIds(attempt.ids, size) && Array.isArray(attempt.answers) ? attempt : null;
            }

            function show(name) {
                var changed = name !== current;
                current = name;
                Object.keys(screens).forEach(function (key) {
                    screens[key].hidden = key !== name;
                });
                stats.hidden = name === 'play';
                // 結果の下の方から最初の画面に戻ったときも、見出しから見えるようにする。開いた直後は動かさない。
                if (changed || name !== 'start') {
                    root.scrollIntoView({block: 'start'});
                }
            }

            function renderStart() {
                Array.prototype.forEach.call(document.querySelectorAll('.quiz-size'), function (button) {
                    var size = Number(button.dataset.size);
                    var attempt = official(size);
                    var status;
                    if (attempt && typeof attempt.marks === 'string') {
                        status = format(msg.msgDone, [scoreOf(attempt.marks), size]);
                    } else if (attempt && attempt.answers.length > 0) {
                        status = format(msg.msgResume, [attempt.answers.length, size]);
                    } else {
                        status = msg.msgNew;
                    }
                    button.querySelector('.quiz-size-status').textContent = status;
                });
                renderStats();
                show('start');
            }

            function start(size) {
                var attempt = official(size);
                if (attempt && typeof attempt.marks === 'string') {
                    showResult(size, true, sameIds(attempt.ids, size) ? attempt.answers : null, attempt.marks);
                    return;
                }
                if (!attempt) {
                    attempt = {ids: idsOf(size), answers: []};
                    update(function (data) {
                        data.days[today] = data.days[today] || {};
                        data.days[today][size] = attempt;
                    });
                }
                play = {size: size, official: true, answers: attempt.answers.slice(), answered: false};
                showQuestion();
            }

            function practice(size) {
                play = {size: size, official: false, answers: [], answered: false};
                showQuestion();
            }

            function showQuestion() {
                var index = play.answers.length;
                var q = questions[index];
                var screen = screens.play;
                var ordering = q.type === 'hp';
                screen.querySelector('.quiz-progress-text').textContent = format(msg.msgProgress, [index + 1, play.size]);
                screen.querySelector('.quiz-practice').hidden = play.official;
                // 練習は保存しないので、やめると続きから再開できない。
                screen.querySelector('.quiz-quit').textContent = play.official ? msg.msgQuit : msg.msgQuitPractice;
                screen.querySelector('.quiz-progress-bar').style.width = (index / play.size * 100) + '%';
                screen.querySelector('.quiz-card').hidden = ordering;
                screen.querySelector('.quiz-choices').hidden = ordering;
                screen.querySelector('.quiz-order').hidden = !ordering;
                screen.querySelector('.quiz-order-howto').hidden = false;
                screen.querySelector('.quiz-submit').hidden = !ordering;
                var prompt = screen.querySelector('.quiz-prompt');
                prompt.textContent = q.prompt;
                prompt.classList.toggle('is-order', ordering);
                if (ordering) {
                    renderOrder(q);
                } else {
                    renderChoices(q);
                }
                screen.querySelector('.quiz-feedback').textContent = '';
                screen.querySelector('.quiz-feedback').className = 'quiz-feedback';
                screen.querySelector('.quiz-note').hidden = true;
                screen.querySelector('.quiz-next').hidden = true;
                play.answered = false;
                // 次の問題の画像を先に読んでおき、テンポよく進めるようにする。
                if (index + 1 < play.size) {
                    questions[index + 1].cards.forEach(function (card) {
                        if (card.icon) {
                            new Image().src = card.icon;
                        }
                    });
                }
                show('play');
            }

            function renderChoices(q) {
                var screen = screens.play;
                var card = q.cards[0];
                var image = screen.querySelector('.quiz-card-image');
                image.hidden = !card.icon;
                if (card.icon) {
                    image.src = card.icon;
                }
                screen.querySelector('.quiz-card-name').textContent = card.name;
                var choices = screen.querySelector('.quiz-choices');
                choices.textContent = '';
                q.choices.forEach(function (label, choice) {
                    var button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'quiz-choice quiz-choice-' + q.type;
                    button.setAttribute('aria-label', format(q.choiceLabel, [label]));
                    var value = document.createElement('span');
                    value.className = 'quiz-choice-value';
                    value.textContent = label;
                    button.appendChild(value);
                    button.addEventListener('click', function () {
                        answerChoice(choice);
                    });
                    choices.appendChild(button);
                });
            }

            function renderOrder(q) {
                drag = null;
                orderList.textContent = '';
                orderList.classList.remove('is-answered');
                q.cards.forEach(function (card, index) {
                    var item = document.createElement('li');
                    item.className = 'quiz-order-item';
                    item.dataset.index = index;
                    if (card.icon) {
                        var image = document.createElement('img');
                        image.src = card.icon;
                        image.alt = '';
                        image.width = 285;
                        image.height = 420;
                        image.draggable = false;
                        item.appendChild(image);
                    }
                    var name = document.createElement('span');
                    name.className = 'quiz-order-name';
                    name.textContent = card.name;
                    item.appendChild(name);
                    var handle = document.createElement('span');
                    handle.className = 'quiz-order-handle';
                    handle.setAttribute('aria-hidden', 'true');
                    handle.textContent = '≡';
                    item.appendChild(handle);
                    var value = document.createElement('span');
                    value.className = 'quiz-order-value';
                    value.hidden = true;
                    item.appendChild(value);
                    orderList.appendChild(item);
                });
            }

            // 答えを記録する(公式の回は1問ごとに保存する)。最後の問題なら true。
            function record(answer) {
                play.answered = true;
                play.answers.push(answer);
                var finished = play.answers.length === play.size;
                if (play.official) {
                    var answers = play.answers.slice();
                    var size = play.size;
                    update(function (data) {
                        data.days[today] = data.days[today] || {};
                        var attempt = {ids: idsOf(size), answers: answers};
                        if (finished) {
                            attempt.marks = marksOf(answers);
                        }
                        data.days[today][size] = attempt;
                        if (finished) {
                            data.maxStreak = Math.max(data.maxStreak || 0, streaks(data).longest);
                        }
                    });
                }
                return finished;
            }

            function showFeedback(correct, wrongText, note, finished) {
                var screen = screens.play;
                var feedback = screen.querySelector('.quiz-feedback');
                feedback.textContent = correct ? msg.msgCorrect : wrongText;
                feedback.className = 'quiz-feedback ' + (correct ? 'is-correct' : 'is-wrong');
                var noteElement = screen.querySelector('.quiz-note');
                noteElement.textContent = note || '';
                noteElement.hidden = !note;
                var next = screen.querySelector('.quiz-next');
                next.textContent = finished ? msg.msgToResult : msg.msgNext;
                next.hidden = false;
                next.focus({preventScroll: true});
            }

            function answerChoice(choice) {
                if (play.answered) {
                    return;
                }
                var q = questions[play.answers.length];
                var finished = record(choice);
                Array.prototype.forEach.call(screens.play.querySelectorAll('.quiz-choice'), function (button, i) {
                    button.disabled = true;
                    if (isCorrect(q, i)) {
                        button.classList.add('is-correct');
                    } else if (i === choice) {
                        button.classList.add('is-wrong');
                    }
                });
                showFeedback(isCorrect(q, choice), format(msg.msgWrong, [q.choices[Number(q.answer)]]), q.note, finished);
            }

            function answerOrder() {
                if (play.answered) {
                    return;
                }
                if (drag) {
                    endDrag();
                }
                var q = questions[play.answers.length];
                var items = Array.prototype.slice.call(orderList.children);
                var order = items.map(function (item) { return item.dataset.index; }).join('');
                var finished = record(order);
                items.forEach(function (item, position) {
                    item.classList.remove('is-selected');
                    item.classList.add(q.answer.charAt(position) === item.dataset.index ? 'is-correct' : 'is-wrong');
                    item.querySelector('.quiz-order-handle').hidden = true;
                    var value = item.querySelector('.quiz-order-value');
                    value.textContent = q.cards[Number(item.dataset.index)].value;
                    value.hidden = false;
                });
                orderList.classList.add('is-answered');
                screens.play.querySelector('.quiz-submit').hidden = true;
                screens.play.querySelector('.quiz-order-howto').hidden = true;
                showFeedback(isCorrect(q, order), format(msg.msgHpWrong, [orderNames(q, q.answer)]), q.note, finished);
            }

            // 並べ替えのタップ: 1枚目を選び、2枚目で入れ替える。同じカードをもう一度押すと選ぶのをやめる。
            function select(item) {
                var selected = orderList.querySelector('.is-selected');
                if (!selected) {
                    item.classList.add('is-selected');
                    return;
                }
                selected.classList.remove('is-selected');
                if (selected !== item) {
                    var marker = document.createElement('li');
                    orderList.replaceChild(marker, selected);
                    orderList.replaceChild(selected, item);
                    orderList.replaceChild(item, marker);
                }
            }

            // 並べ替えのドラッグとタップ。HTML5のドラッグ&ドロップはスマホの指で動かないことがあるので、Pointer Eventsで動かす。
            // 指で動かせるよう、行はCSSの touch-action: none で画面のスクロールを止めている。
            // ポインターは一覧に捕まえる(動かしている行に捕まえると、行をDOMの中で動かしたときに外れるため)。
            // そのため click は一覧に届き、どの行を押したか分からないので、タップは指を離したときに判定する。
            orderList.addEventListener('pointerdown', function (event) {
                var item = event.target.closest('.quiz-order-item');
                if (!item || play.answered || drag || !event.isPrimary || event.button !== 0) {
                    return;
                }
                var rect = item.getBoundingClientRect();
                drag = {item: item, pointerId: event.pointerId, startY: event.clientY,
                    center: rect.top + rect.height / 2, moved: false};
                orderList.setPointerCapture(event.pointerId);
            });

            orderList.addEventListener('pointermove', function (event) {
                if (!drag || event.pointerId !== drag.pointerId) {
                    return;
                }
                var dy = event.clientY - drag.startY;
                if (!drag.moved) {
                    if (Math.abs(dy) < DRAG_THRESHOLD) {
                        return;
                    }
                    drag.moved = true;
                    drag.item.classList.add('is-dragging');
                    var selected = orderList.querySelector('.is-selected');
                    if (selected) {
                        selected.classList.remove('is-selected');
                    }
                }
                var item = drag.item;
                // 動かしているカードの中心が、ほかのカードの中心を越えたら、その位置に入れる。
                // 見た目は一覧からはみ出さないように止めるが、比べるのは止める前の位置(止めた位置だと端のカードの中心と同じになり、端に入れられない)。
                var center = drag.center + dy;
                var listRect = orderList.getBoundingClientRect();
                var half = item.offsetHeight / 2;
                var shown = Math.min(Math.max(center, listRect.top + half), listRect.bottom - half);
                var before = null;
                var others = Array.prototype.filter.call(orderList.children, function (other) {
                    return other !== item;
                });
                for (var i = 0; i < others.length; i++) {
                    var rect = others[i].getBoundingClientRect();
                    if (center < rect.top + rect.height / 2) {
                        before = others[i];
                        break;
                    }
                }
                if (item.nextElementSibling !== before) {
                    orderList.insertBefore(item, before);
                }
                item.style.transform = '';
                var placed = item.getBoundingClientRect();
                item.style.transform = 'translateY(' + (shown - (placed.top + placed.height / 2)) + 'px)';
            });

            function endDrag() {
                drag.item.classList.remove('is-dragging');
                drag.item.style.transform = '';
                drag = null;
            }

            orderList.addEventListener('pointerup', function (event) {
                if (!drag || event.pointerId !== drag.pointerId) {
                    return;
                }
                var item = drag.item;
                var moved = drag.moved;
                endDrag();
                if (!moved) {
                    select(item);
                }
            });

            function cancelDrag(event) {
                if (drag && event.pointerId === drag.pointerId) {
                    endDrag();
                }
            }

            orderList.addEventListener('pointercancel', cancelDrag);
            orderList.addEventListener('lostpointercapture', cancelDrag);

            function next() {
                if (play.answers.length < play.size) {
                    showQuestion();
                } else {
                    showResult(play.size, play.official, play.answers, marksOf(play.answers));
                }
            }

            function cardLink(card, value) {
                var link = document.createElement('a');
                link.href = card.link;
                if (card.icon) {
                    var image = document.createElement('img');
                    image.src = card.icon;
                    image.alt = '';
                    image.width = 285;
                    image.height = 420;
                    image.loading = 'lazy';
                    link.appendChild(image);
                }
                var name = document.createElement('span');
                name.className = 'quiz-wrong-name';
                name.textContent = card.name;
                link.appendChild(name);
                if (value) {
                    var valueElement = document.createElement('span');
                    valueElement.className = 'quiz-wrong-value';
                    valueElement.textContent = value;
                    link.appendChild(valueElement);
                }
                return link;
            }

            function wrongItem(q, answer) {
                var item = document.createElement('li');
                var detail = document.createElement('span');
                detail.className = 'quiz-wrong-detail';
                if (q.type === 'hp') {
                    // 正しい順(ヒットポイントの多い順)に4枚を並べ、あなたの並べた順を文で添える。
                    item.className = 'quiz-wrong-order';
                    var cards = document.createElement('div');
                    cards.className = 'quiz-wrong-cards';
                    q.answer.split('').forEach(function (index) {
                        var card = q.cards[Number(index)];
                        cards.appendChild(cardLink(card, card.value));
                    });
                    item.appendChild(cards);
                    detail.textContent = format(msg.msgWrongOrder, [orderNames(q, String(answer))]);
                } else {
                    item.appendChild(cardLink(q.cards[0]));
                    detail.textContent = format(msg.msgWrongItem, [q.choices[Number(q.answer)], q.choices[answer]]);
                }
                item.appendChild(detail);
                return item;
            }

            // answers が無いのは、終えた後にその日の問題が変わった回。点数と正誤だけ出す。
            function showResult(size, isOfficial, answers, marks) {
                var screen = screens.result;
                var score = scoreOf(marks);
                screen.querySelector('.quiz-practice').hidden = isOfficial;
                screen.querySelector('.quiz-score').textContent = format(msg.msgScore, [score, size]);
                screen.querySelector('.quiz-perfect').hidden = score !== size;
                var rows = [];
                for (var i = 0; i < marks.length; i += GRID_COLUMNS) {
                    rows.push(marks.slice(i, i + GRID_COLUMNS).replace(/o/g, '🟩').replace(/x/g, '🟥'));
                }
                screen.querySelector('.quiz-grid').textContent = rows.join('\n');
                var list = screen.querySelector('.quiz-wrong-list');
                list.textContent = '';
                (answers || []).forEach(function (answer, i) {
                    if (!isCorrect(questions[i], answer)) {
                        list.appendChild(wrongItem(questions[i], answer));
                    }
                });
                screen.querySelector('.quiz-wrong').hidden = list.children.length === 0;
                screen.querySelector('.quiz-retry').onclick = function () {
                    practice(size);
                };
                renderStats();
                show('result');
            }

            // 公式の成績を終えた日が続いた数。今日まだなら昨日までで数える。
            function streaks(data) {
                var days = Object.keys(data.days).filter(function (day) {
                    var attempts = data.days[day];
                    return Object.keys(attempts).some(function (size) {
                        return attempts[size] && typeof attempts[size].marks === 'string';
                    });
                }).map(dayNumber).sort(function (a, b) { return a - b; });
                var played = {};
                var longest = 0;
                var run = 0;
                days.forEach(function (day, i) {
                    played[day] = true;
                    run = i > 0 && days[i - 1] === day - 1 ? run + 1 : 1;
                    longest = Math.max(longest, run);
                });
                var day = dayNumber(today);
                if (!played[day]) {
                    day -= 1;
                }
                var currentRun = 0;
                while (played[day]) {
                    currentRun += 1;
                    day -= 1;
                }
                return {current: currentRun, longest: Math.max(longest, data.maxStreak || 0)};
            }

            function renderStats() {
                var streak = streaks(store);
                stats.querySelector('.quiz-streak').textContent = format(msg.msgStreak, [streak.current, streak.longest]);
                var any = false;
                Array.prototype.forEach.call(stats.querySelectorAll('tbody tr'), function (row) {
                    var size = row.dataset.size;
                    var plays = 0;
                    var correct = 0;
                    var perfect = 0;
                    Object.keys(store.days).forEach(function (day) {
                        var attempt = store.days[day][size];
                        if (attempt && typeof attempt.marks === 'string') {
                            var score = scoreOf(attempt.marks);
                            plays += 1;
                            correct += score;
                            perfect += score === Number(size) ? 1 : 0;
                        }
                    });
                    any = any || plays > 0;
                    row.querySelector('.quiz-plays').textContent = plays;
                    row.querySelector('.quiz-average').textContent = plays > 0
                        ? Math.round(correct / (plays * Number(size)) * 100) + '%' : '-';
                    row.querySelector('.quiz-perfect-count').textContent = perfect;
                });
                stats.querySelector('.quiz-stats-table').hidden = !any;
                stats.querySelector('.quiz-stats-empty').hidden = any;
            }

            function renderCountdown() {
                var remaining = (dayNumber(today) + 1) * DAY_MS - Date.now();
                var text;
                if (remaining <= 0) {
                    text = msg.msgNewDay;
                } else {
                    var seconds = Math.floor(remaining / 1000);
                    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
                    text = format(msg.msgCountdown, [Math.floor(seconds / 3600) + ':' + pad(Math.floor(seconds / 60) % 60)
                        + ':' + pad(seconds % 60)]);
                }
                screens.start.querySelector('.quiz-countdown').textContent = text;
            }

            Array.prototype.forEach.call(document.querySelectorAll('.quiz-size'), function (button) {
                button.addEventListener('click', function () {
                    start(Number(button.dataset.size));
                });
            });
            screens.play.querySelector('.quiz-submit').addEventListener('click', answerOrder);
            screens.play.querySelector('.quiz-next').addEventListener('click', next);
            screens.play.querySelector('.quiz-quit').addEventListener('click', function () {
                store = load();
                renderStart();
            });
            screens.result.querySelector('.quiz-back').addEventListener('click', function () {
                store = load();
                renderStart();
            });
            // PCでは数字キーで選べるようにする。並べ替えでは数字キーでカードを選んで入れ替え、Enterで答える
            // (ボタンにフォーカスがあるときのEnterは、そのボタンを押したことになるので任せる)。
            document.addEventListener('keydown', function (event) {
                if (current !== 'play' || play.answered || event.ctrlKey || event.metaKey || event.altKey) {
                    return;
                }
                var q = questions[play.answers.length];
                var number = Number(event.key) - 1;
                if (q.type === 'hp') {
                    if (number >= 0 && number < orderList.children.length) {
                        select(orderList.children[number]);
                    } else if (event.key === 'Enter' && !event.target.closest('button, a')) {
                        event.preventDefault();
                        answerOrder();
                    }
                    return;
                }
                if (number >= 0 && number < q.choices.length) {
                    answerChoice(number);
                }
            });
            // 「戻る」で保存されていた画面が出たとき、別のタブで遊んだ分を反映する。
            window.addEventListener('pageshow', function (event) {
                if (event.persisted && current === 'start') {
                    store = load();
                    renderStart();
                }
            });

            renderStart();
            renderCountdown();
            setInterval(renderCountdown, 1000);
        })();
    </script>
</body>
</html>
