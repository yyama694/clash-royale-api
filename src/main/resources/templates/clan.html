<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${clan.name()})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToSearch}"></span></a>

        <div class="card">
            <h1 th:text="${clan.name()}"></h1>
            <p><span class="tag-pill" th:text="${clan.tag()}"></span></p>
            <p th:if="${clan.description()}" th:text="${clan.description()}"></p>
            <ul class="stat-grid">
                <li><span class="label">🏆 <span th:text="#{clan.score}"></span></span><span class="value" th:text="${clan.clanScore()}"></span></li>
                <li><span class="label">👥 <span th:text="#{clan.memberCount}"></span></span><span class="value" th:text="${clan.members()}"></span></li>
            </ul>
        </div>

        <div class="card">
            <h2 th:text="#{clan.memberList.heading}"></h2>
            <p class="notice" th:text="'※' + #{clan.donationNotice}"></p>
            <p class="notice" th:text="'※' + #{clan.lastSeenNotice}"></p>
            <div class="table-scroll">
                <table class="table-sortable">
                    <thead>
                        <tr>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.name}, 'name', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.role}, 'role', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.trophies}, 'trophies', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.donations}, 'donations', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.lastSeen}, 'lastSeen', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="member : ${members}">
                            <td th:attr="data-label=#{clan.col.name}"><a th:href="@{/player/{tag}(tag=${member.pathTag()})}" th:text="${member.name()}"></a></td>
                            <td th:attr="data-label=#{clan.col.role}" th:text="${member.role()}"></td>
                            <td th:attr="data-label=#{clan.col.trophies}" th:text="${member.trophies()}"></td>
                            <td th:attr="data-label=#{clan.col.donations}" th:text="${member.donations()}"></td>
                            <td th:attr="data-label=#{clan.col.lastSeen}" th:switch="${member.inactiveDays()}">
                                <span th:case="null" th:text="#{clan.lastSeen.unknown}"></span>
                                <span th:case="0" th:text="#{clan.lastSeen.today}"></span>
                                <span th:case="1" th:text="#{clan.lastSeen.day}"></span>
                                <span th:case="*" th:text="#{clan.lastSeen.days(${member.inactiveDays()})}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
