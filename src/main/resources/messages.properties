about.intro=Princess Tower is an unofficial fan site for Clash Royale players around the world. It uses the official Clash Royale API provided by Supercell to show player and clan information, rankings, card usage rates and the decks of top players.
about.operator.heading=Who runs this site
about.operator.body=This site is run by an individual in Japan as a personal project. It is not run by a company and has no connection with Supercell.
about.data.heading=About the data
about.data.body=All game data comes from the official API. Player and clan information is refreshed every few minutes, and the decks of top players and card usage rates are collected once a day. If something looks wrong, please let us know.
about.contact.heading=Contact
about.contact.body=For bug reports, ideas for new features, or requests to remove your player information, please send a direct message on X:
about.privacy=How this site handles information is explained in the Privacy Policy:
# --- Privacy policy (English and Japanese only; other languages fall back to this English text) ---
privacy.languageNote=This policy is available in English and Japanese.
privacy.effective=Effective date: October 4, 2026 (revised October 8, 2026)
privacy.intro=Princess Tower ("this site") is an unofficial fan site that uses the official Clash Royale API provided by Supercell. This policy explains what information this site handles and how.
privacy.collect.heading=Information this site records
privacy.collect.logs=Server logs: when a page is shown, the server records the IP address, date and time, the page URL, the referring page and the browser type (user agent). They are used to investigate problems and to count visits, and are deleted after about five weeks.
privacy.collect.beacon=Page view count: each page sends this site only its own path, the source tag added to links shared by this site or to its home screen icon if present (such as ?from=x), and whether you have visited this site before on an earlier day (a returning visit). No cookie or other value that identifies you is sent. It is recorded in the server logs above and used only to count page views and returning visits.
privacy.collect.players=Player information: for the name search and the ranking report, this site stores the tags and names of players it has seen through the official API or on its pages (and, for players in the global Rank Battle ranking, their rank and rating every 15 minutes). These are shown publicly in the game. If you would like your player information removed, please contact us below.
privacy.storage.heading=Cookies and data stored in your browser
privacy.storage.cookies=Cookies: your favorites (fav_players, fav_clans), the language you chose in the language menu (lang), the country or region you chose in the rankings (country) and the player you marked with "This is me" (me), whose stats are shown at the top of the home page. They are used only for these features of this site, expire after one year and are never used for advertising or for tracking you on other sites.
privacy.storage.local=Browser storage (localStorage and sessionStorage): to show what changed since your last visit on player pages, the trophies and other values of up to 100 recently viewed players are kept in localStorage. To show "Recently viewed" on the home page, the names and tags of the last 10 players and 5 clans you opened are also kept in localStorage (you can remove them with "Clear history" on the home page). To show the favorites tip from time to time, the number of times you have opened player and clan pages is also kept in localStorage. To tell whether a visit is a returning one, the time of your first visit to this site and the time of your last page view are also kept in localStorage. In addition, timestamps used to keep the favorites list and the display language up to date, and the destination of the "Back" link (the page on this site you viewed just before), are kept temporarily in sessionStorage. This data stays in your browser and is never sent to this site, except that whether a visit is a returning one, worked out from these times, is sent with the page view count above.
privacy.storage.control=You can delete or block cookies and browser storage in your browser settings. Favorites and similar features will then stop working.
privacy.external.heading=External services
privacy.external.images=Card images are loaded by your browser directly from Supercell's servers (api-assets.clashroyale.com), so your IP address and similar information are sent to Supercell.
privacy.external.share=The "Share on X" button opens the post screen of X (formerly Twitter), and the link to X in the footer opens this site's X account. Nothing is sent to X unless you press them. The "Share" button opens your device's share menu, and the link is passed only to the app you choose.
privacy.external.analytics=This site currently uses no external advertising or analytics services (such as Google Analytics). This page will be updated before any are introduced.
privacy.thirdParty.heading=Sharing with third parties
privacy.thirdParty.body=This site does not provide the information it records to third parties, except where required by law.
privacy.changes.heading=Changes to this policy
privacy.changes.body=When this policy changes, the new version will be posted on this page.
privacy.contact.heading=Contact
privacy.contact.body=Please send a direct message on X:
