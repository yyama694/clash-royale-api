<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{clanSearch.pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToTop}"></span></a>

        <!--/* 該当なしは入力の問題でシステムエラーではないので、赤いエラー表示にせず、入力値を残した検索フォームを添える */-->
        <th:block th:if="${candidates == null}">
            <div class="notice-box" th:text="#{clanSearch.empty}"></div>
            <div th:replace="~{fragments/layout :: clanSearchForm(${query})}"></div>
        </th:block>

        <div th:if="${candidates != null}" class="card">
            <h1 th:text="#{clanSearch.heading(${query})}"></h1>
            <p class="notice" th:if="${total > candidates.size()}"
               th:text="#{clanSearch.notice(${total}, ${candidates.size()})}"></p>
            <ul class="result-list">
                <li th:each="c : ${candidates}">
                    <div class="result-main">
                        <span class="name" th:text="${c.name()}"></span>
                        <span class="tag-pill" th:text="${c.tag()}"></span>
                    </div>
                    <div class="result-meta">
                        <span><span th:text="#{clanSearch.score}"></span> <span th:text="${c.clanScore()}"></span></span>
                        <span th:text="#{clanSearch.members(${c.members()})}"></span>
                    </div>
                    <a class="btn btn-secondary" th:href="@{/clan/{tag}(tag=${c.pathTag()})}" th:text="#{action.view}"></a>
                </li>
            </ul>
        </div>
    </main>
</body>
</html>
