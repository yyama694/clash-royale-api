<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <!--/* 直接開かれたとき(戻る履歴が無いとき)の戻り先は、トップページよりカード一覧の方が自然 */-->
        <a class="back-link" th:href="@{/cards}">&laquo; <span th:text="#{action.backToCards}"></span></a>

        <div class="card">
            <h1><bdi th:text="${card.name()}"></bdi></h1>
            <!--/* 英語以外のUIでは英語名も併記する。英語UIでは同じ文字列になるので出さない。 */-->
            <p class="card-english-name" th:if="${card.englishName() != card.name()}"
               lang="en" th:text="${card.englishName()}"></p>

            <div class="card-detail">
                <!--/* 進化(限界突破)・ヒーローがあるカードは複数並ぶため、どれがどれか分かるよう通常側にもラベルを付ける */-->
                <div class="card-artwork">
                    <figure th:if="${card.iconUrl() != null}">
                        <img th:src="${card.iconUrl()}" alt="" width="285" height="420">
                        <figcaption th:if="${card.hasOtherForms()}" th:text="#{card.normal}"></figcaption>
                    </figure>
                    <figure th:if="${card.evolutionIconUrl() != null}">
                        <img th:src="${card.evolutionIconUrl()}" alt="" width="285" height="420">
                        <figcaption th:text="#{card.evolution}"></figcaption>
                    </figure>
                    <figure th:if="${card.heroIconUrl() != null}">
                        <img th:src="${card.heroIconUrl()}" alt="" width="285" height="420">
                        <figcaption th:text="#{card.hero}"></figcaption>
                    </figure>
                    <figure th:if="${card.ground() != null and card.ground().iconUrl() != null}">
                        <img th:src="${card.ground().iconUrl()}" alt="" width="285" height="420">
                        <figcaption th:text="${card.ground().name()}"></figcaption>
                    </figure>
                </div>

                <!--/* 地上に出すと別のコストになるカード(スピリットエンプレス)は、地上のコストをゲームの項目名で並べる */-->
                <ul class="stat-grid">
                    <li><span class="label" th:text="#{card.rarity}"></span><span class="value" th:text="${card.rarity()}"></span></li>
                    <li th:if="${card.elixirCost() != null}"><span class="label" th:text="#{card.elixirCost}"></span><span class="value" th:text="${card.elixirCost()}"></span></li>
                    <li th:if="${card.ground() != null}"><span class="label" th:text="#{stat.TID_SPELL_ATTRIBUTE_ALTERNATE_CARD}"></span><span class="value" th:text="${card.ground().elixirCost()}"></span></li>
                    <li><span class="label" th:text="#{card.levelRange}"></span><span class="value" th:text="#{card.levelRange.value(${card.minLevel()}, ${card.maxLevel()})}"></span></li>
                </ul>
            </div>

            <p th:replace="~{fragments/layout :: notice(#{card.notice})}"></p>
        </div>

        <!--/*
          ステータス(ゲーム内のカード情報の画面から読み取ったもの)。レベル16とレベル11をラジオボタンで切り替える。
          JSは使わず、表より前の兄弟に置いたラジオボタンの :checked から CSS で列を出し分ける。
        */-->
        <section class="card" id="stats" th:if="${cardStats}">
            <h2 th:text="#{cardStats.heading}"></h2>
            <input class="visually-hidden stats-level" type="radio" name="stats-level" id="stats-level16" checked>
            <input class="visually-hidden stats-level" type="radio" name="stats-level" id="stats-level11">
            <div class="tabs stats-level-switch" role="group" th:aria-label="#{cardStats.levelSwitch}">
                <label class="tab" for="stats-level16" th:text="#{stat.TID_SPELL_ITEM_LEVEL(16)}"></label>
                <label class="tab" for="stats-level11" th:text="#{stat.TID_SPELL_ITEM_LEVEL(11)}"></label>
            </div>
            <div class="stats-body">
                <th:block th:each="s : ${cardStats.sections()}">
                    <h3 th:if="${s.heading() != null}" th:text="${s.heading()}"></h3>
                    <p th:if="${s.lead() != null}" class="stats-lead" th:text="${s.lead()}"></p>
                    <ul class="stat-grid stat-grid-compact">
                        <li th:each="r : ${s.rows()}">
                            <span class="label" th:text="${r.label()}"></span>
                            <span class="value stats-level16" th:text="${r.level16()}"></span>
                            <span class="value stats-level11" th:text="${r.level11() ?: '—'}"></span>
                        </li>
                    </ul>
                </th:block>
            </div>
            <th:block th:if="${cardStats.towerReductionNotice() != null}">
                <p th:replace="~{fragments/layout :: notice(${cardStats.towerReductionNotice()})}"></p>
            </th:block>
            <p th:replace="~{fragments/layout :: notice(${cardStats.notice()})}"></p>
        </section>

        <div th:if="${usage}" class="card">
            <h2 th:text="#{cardUsage.heading}"></h2>
            <ul class="stat-grid">
                <li><span class="label" th:text="#{cardUsage.rate}"></span><span class="value" th:text="#{cardUsage.rate.value(${usage.percent()})}"></span></li>
                <li><span class="label" th:text="#{cardUsage.users}"></span><span class="value" th:text="#{cardUsage.users.value(${usage.users()}, ${usage.sampleSize()})}"></span></li>
                <li th:if="${usage.rank() != null}"><span class="label" th:text="#{cardUsage.rank}"></span><span class="value"><a th:href="@{/cards(sort=usage)}" th:text="#{cardUsage.rank.value(${usage.rank()}, ${usage.rankedOf()})}"></a></span></li>
            </ul>

            <th:block th:unless="${#lists.isEmpty(usage.partners())}">
                <h3 th:text="#{cardUsage.partners.heading}"></h3>
                <div class="deck-grid">
                    <div class="deck-card" th:each="p : ${usage.partners()}">
                        <a th:replace="~{fragments/layout :: cardLink(${p.id()}, ${p.name()}, ${p.iconUrl()})}"></a>
                        <div class="card-name" th:text="${p.name()}"></div>
                        <div class="card-sub" th:text="#{cardUsage.partner.value(${p.percent()})}"></div>
                    </div>
                </div>
                <p th:replace="~{fragments/layout :: notice(#{cardUsage.partners.notice})}"></p>
            </th:block>

            <th:block th:if="${usage.seasonNotice() != null}">
                <p th:replace="~{fragments/layout :: notice(${usage.seasonNotice()})}"></p>
            </th:block>
            <p th:replace="~{fragments/layout :: notice(#{cardUsage.notice(${usage.sampleSize()})})}"></p>
            <p class="notice"><span th:text="#{cardUsage.collectedAt}"></span>
                <time th:replace="~{fragments/layout :: localTime(${usage.collectedAt()})}"></time></p>
        </div>

        <!--/*
          世界上位どうしの対戦で、このカード入りのデッキの勝率が全体より高かった(低かった)相手のカード。
          勝率はどちらもこのカード入りのデッキの側から見たもの(プレイヤー情報画面の得意/苦手カードが本人の勝率を出すのと同じ)。
          苦手なカード(#counters)には、プレイヤー情報画面の苦手カードの「対策を見る」から来る。
          数えられるだけの対戦が無いカード(使用率の低いカード)と、初回の集計が終わる前は出さない。
        */-->
        <section class="card" id="matchups" th:if="${matchups}">
            <div class="matchups-list" id="favorable" th:unless="${#lists.isEmpty(matchups.favorable())}">
                <h2 th:text="#{matchups.favorable.heading(${card.name()})}"></h2>
                <p th:text="#{matchups.favorable.lead(${card.name()}, ${matchups.players()})}"></p>
                <div class="deck-grid perf-grid">
                    <div class="deck-card perf-good" th:each="c : ${matchups.favorable()}">
                        <a th:replace="~{fragments/layout :: cardLink(${c.id()}, ${c.name()}, ${c.iconUrl()})}"></a>
                        <div class="card-name" th:text="${c.name()}"></div>
                        <div class="card-sub perf-rate" th:text="#{matchups.value(${c.winRatePercent()}, ${c.battles()})}"></div>
                    </div>
                </div>
            </div>
            <div class="matchups-list" id="counters" th:unless="${#lists.isEmpty(matchups.unfavorable())}">
                <h2 th:text="#{matchups.unfavorable.heading(${card.name()})}"></h2>
                <p th:text="#{matchups.unfavorable.lead(${card.name()}, ${matchups.players()})}"></p>
                <div class="deck-grid perf-grid">
                    <div class="deck-card perf-bad" th:each="c : ${matchups.unfavorable()}">
                        <a th:replace="~{fragments/layout :: cardLink(${c.id()}, ${c.name()}, ${c.iconUrl()})}"></a>
                        <div class="card-name" th:text="${c.name()}"></div>
                        <div class="card-sub perf-rate" th:text="#{matchups.value(${c.winRatePercent()}, ${c.battles()})}"></div>
                    </div>
                </div>
            </div>
            <p th:text="#{matchups.baseline(${card.name()}, ${matchups.battles()}, ${matchups.winRatePercent()})}"></p>
            <p th:replace="~{fragments/layout :: notice(#{matchups.notice(${matchups.minBattles()})})}"></p>
            <p class="notice"><span th:text="#{matchups.period}"></span>
                <time th:replace="~{fragments/layout :: localTime(${matchups.from()})}"></time>
                <span th:text="#{matchups.period.to}"></span>
                <time th:replace="~{fragments/layout :: localTime(${matchups.to()})}"></time></p>
        </section>

        <section class="card" id="balance" th:unless="${#lists.isEmpty(balanceHistory)}">
            <h2 th:text="#{balance.cardHeading}"></h2>
            <ul class="balance-list">
                <th:block th:each="e : ${balanceHistory}">
                    <li th:replace="~{fragments/layout :: balanceChange(${e.change()}, ${e.heading()}, ${e.anchor()})}"></li>
                </th:block>
            </ul>
            <a class="btn btn-secondary card-action" th:href="@{/balance}" th:text="#{balance.all}"></a>
        </section>

        <!--/*
          このカードを使っているトッププレイヤーのうち、順位の高い人のデッキ。全員分はデッキ画面(カードで絞り込み)へつなぐ。
          誰も使っていないカードと、初回の集計が終わる前は出さない(使用率の欄に人数が出ているので、空の欄は置かない)。
        */-->
        <section class="card" id="top-decks" th:if="${topDecks != null and not #lists.isEmpty(topDecks)}">
            <h2 th:text="#{decks.heading.card(${card.name()})}"></h2>
            <p th:text="#{cardDecks.lead}"></p>
            <div class="top-deck top-deck-item" th:each="d : ${topDecks}">
                <th:block th:replace="~{fragments/layout :: topDeck(${d})}"></th:block>
            </div>
            <a class="btn btn-secondary card-action" th:if="${topDecksTotal > #lists.size(topDecks)}"
               th:href="@{/decks(card=${card.id()})}" th:text="#{cardDecks.all(${topDecksTotal})}"></a>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
