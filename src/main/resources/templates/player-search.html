<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{playerSearch.pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToTop}"></span></a>

        <!--/* 該当なしは入力の問題でシステムエラーではないので、赤いエラー表示にせず、入力値を残した検索フォームを添える */-->
        <th:block th:if="${exact == null}">
            <div class="notice-box">
                <p th:text="#{playerSearch.empty}"></p>
                <p th:text="#{playerSearch.howItWorks}"></p>
            </div>
            <div th:replace="~{fragments/layout :: playerSearchForm(${query})}"></div>
        </th:block>

        <div th:if="${exact != null}" class="card">
            <h1 th:text="#{playerSearch.heading(${query})}"></h1>
            <p th:replace="~{fragments/layout :: notice(#{playerSearch.caveat})}"></p>
            <p class="notice-box" th:if="${morePrefix}" th:text="#{playerSearch.tooMany(${query})}"></p>

            <section th:if="${exactTotal > 0}" class="search-section">
                <h2 th:text="#{playerSearch.exactHeading}"></h2>
                <p class="notice" th:text="#{playerSearch.exactNotice(${exactTotal})}"></p>
                <ul class="result-list">
                    <th:block th:each="p : ${exact}"><li th:replace="~{fragments/layout :: playerNameItem(${p})}"></li></th:block>
                </ul>
                <nav class="pager" th:if="${prevPage != null or nextPage != null}">
                    <a class="btn btn-secondary" th:if="${prevPage != null}"
                       th:href="@{/player/search(q=${query},page=${prevPage})}" th:text="#{playerSearch.prev}"></a>
                    <span class="pager-range" th:text="#{playerSearch.range(${exactFrom}, ${exactTo}, ${exactTotal})}"></span>
                    <a class="btn btn-secondary" th:if="${nextPage != null}"
                       th:href="@{/player/search(q=${query},page=${nextPage})}" th:text="#{playerSearch.next}"></a>
                </nav>
            </section>

            <section th:if="${!prefix.isEmpty()}" class="search-section">
                <h2 th:text="#{playerSearch.prefixHeading(${query})}"></h2>
                <ul class="result-list">
                    <th:block th:each="p : ${prefix}"><li th:replace="~{fragments/layout :: playerNameItem(${p})}"></li></th:block>
                </ul>
            </section>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
