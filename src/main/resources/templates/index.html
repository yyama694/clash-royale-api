<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clash Royale 検索(by yyama)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <p class="notice" style="margin-bottom: 1.25rem;">Clash Royale公式APIを使って、プレイヤーやクランのタグから実績・戦績・メンバー情報を調べられます。</p>

        <div class="card">
            <h2>プレイヤー検索</h2>
            <form class="search-form" th:action="@{/player}" method="get">
                <label>プレイヤータグ(#は省略可)
                    <input type="text" name="tag" placeholder="例: 2ABC123">
                </label>
                <button type="submit">検索</button>
            </form>
        </div>

        <div class="card">
            <h2>クラン検索</h2>
            <form class="search-form" th:action="@{/clan}" method="get">
                <label>クランタグ(#は省略可) または クラン名
                    <input type="text" name="tag" placeholder="例: 2XYZ456 または 償い">
                </label>
                <button type="submit">検索</button>
            </form>
        </div>
    </main>
</body>
</html>
