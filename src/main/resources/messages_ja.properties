# --- プライバシーポリシー(英語と日本語だけ。他の言語では英語版を出す) ---
privacy.languageNote=このポリシーは英語と日本語で掲載しています。
privacy.effective=制定日: 2026年10月4日(2026年10月6日改定)
privacy.intro=Princess Tower(以下「当サイト」)は、Supercellが提供するクラロワの公式APIを使った非公式のファンサイトです。当サイトでの情報の取り扱いを次のとおり定めます。
privacy.collect.heading=当サイトが記録する情報
privacy.collect.logs=サーバーのログ: ページを表示したときの、IPアドレス・日時・表示したページのURL・参照元のページ・ブラウザの種類(ユーザーエージェント)を記録します。障害の調査と訪問数の集計に使い、約5週間で消去します。
privacy.collect.beacon=表示回数の計測: 各ページは、表示されたときにそのページのパスと、当サイトが共有したリンクに付けた経路の目印(?from=x など)だけを当サイトに送ります。Cookieなど閲覧者を識別する値は送りません。上のサーバーのログに記録し、表示回数の集計だけに使います。
privacy.collect.players=プレイヤーの情報: 名前検索とランキングの動き画面のため、公式APIや当サイトの画面で確認したプレイヤーのタグと名前を保存しています(ランク戦の世界ランキングに載っているプレイヤーは、15分ごとの順位とレーティングも)。これらはゲーム内で公開されている情報です。ご自身のプレイヤー情報の削除を希望する場合は、下のお問い合わせ先にご連絡ください。
privacy.storage.heading=Cookieとブラウザへの保存
privacy.storage.cookies=Cookie: お気に入り(fav_players・fav_clans)、言語メニューで選んだ言語(lang)、ランキングで選んだ国・地域(country)を保存します。いずれも当サイトのこれらの機能のためだけに使い、有効期限は1年です。広告や、他のサイトでの追跡には使いません。
privacy.storage.local=ブラウザの保存領域(localStorage・sessionStorage): プレイヤー情報画面で「前回見たときから」の変化を出すため、最近見た100人分のトロフィーなどの値をlocalStorageに保存します。お気に入りの一覧を最新にするための時刻も、sessionStorageに一時的に保存します。これらは閲覧者のブラウザの中だけにあり、当サイトには送りません。
privacy.storage.control=Cookieやブラウザの保存領域は、ブラウザの設定で削除・無効にできます。その場合、お気に入りなどの機能は使えなくなります。
privacy.external.heading=外部のサービス
privacy.external.images=カードの画像は、閲覧者のブラウザがSupercellのサーバー(api-assets.clashroyale.com)から直接読み込みます。そのため、IPアドレスなどがSupercellに送られます。
privacy.external.share=「Xでシェア」ボタンを押すとX(旧Twitter)の投稿画面が、フッターのXへのリンクを押すと当サイトのXのアカウントが開きます。押さない限り、Xに情報は送られません。
privacy.external.analytics=当サイトは現在、広告やアクセス解析の外部サービス(Google Analyticsなど)を使っていません。導入する前に、このページを更新します。
privacy.thirdParty.heading=第三者への提供
privacy.thirdParty.body=法令に基づく場合を除き、当サイトが記録した情報を第三者に提供しません。
privacy.changes.heading=このポリシーの変更
privacy.changes.body=内容を変更したときは、このページに掲載します。
privacy.contact.heading=お問い合わせ
privacy.contact.body=XのDMでご連絡ください:
