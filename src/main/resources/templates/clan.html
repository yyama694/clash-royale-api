<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToTop}"></span></a>

        <div class="card">
            <div class="page-heading">
                <h1><bdi th:text="${clanName}"></bdi></h1>
                <span th:replace="~{fragments/layout :: favoriteButton('clans', ${clanPathTag}, ${favorite}, ${favoriteLimit}, ${favoriteHint})}"></span>
            </div>
            <p><span class="tag-pill" th:text="${clan.tag()}"></span></p>
            <div th:replace="~{fragments/layout :: shareButtons(${shareText}, '/clan/' + ${clanPathTag})}"></div>
            <p class="clan-description" th:if="${clan.description()}" th:text="${clan.description()}"></p>
            <!--/* 参加条件(タイプ・必要トロフィー数・所在地)は、入れるクランを探している人が最初に知りたいので、基本情報と並べる */-->
            <ul class="stat-grid">
                <li><span class="label"><span aria-hidden="true">🏆</span> <span th:text="#{clan.score}"></span></span><span class="value" th:text="${#numbers.formatInteger(clan.clanScore(), 1, 'DEFAULT')}"></span></li>
                <!--/* クラン対戦の強さ。入るクランを探している人がクランスコアと並べて見られるように(クランランキングと同じ値) */-->
                <li><span class="label"><span aria-hidden="true">⚔️</span> <span th:text="#{ranking.col.warTrophies}"></span></span><span class="value" th:text="${#numbers.formatInteger(clan.clanWarTrophies(), 1, 'DEFAULT')}"></span></li>
                <li><span class="label"><span aria-hidden="true">👥</span> <span th:text="#{clan.memberCount}"></span></span><span class="value" th:text="${clan.members()}"></span></li>
                <li th:if="${join.typeLabel()}"><span class="label"><span aria-hidden="true">🚪</span> <span th:text="#{clan.type}"></span></span><span class="value" th:text="${join.typeLabel()}"></span></li>
                <li><span class="label"><span aria-hidden="true">🔑</span> <span th:text="#{clan.requiredTrophies}"></span></span><span class="value" th:text="${#numbers.formatInteger(join.requiredTrophies(), 1, 'DEFAULT')}"></span></li>
                <li th:if="${join.locationName()}"><span class="label"><span aria-hidden="true">📍</span> <span th:text="#{clan.location}"></span></span><span class="value" th:text="${join.locationName()}"></span></li>
                <li><span class="label"><span aria-hidden="true">🎁</span> <span th:text="#{clan.donationsPerWeek}"></span></span><span class="value" th:text="${#numbers.formatInteger(join.donationsPerWeek(), 1, 'DEFAULT')}"></span></li>
            </ul>
        </div>

        <div class="card" id="members">
            <h2 th:text="#{clan.memberList.heading}"></h2>
            <div class="table-scroll">
                <table class="table-sortable">
                    <thead>
                        <tr>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.rank}, 'rank', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.name}, 'name', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.role}, 'role', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.trophies}, 'trophies', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.donations}, 'donations', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                            <th th:replace="~{fragments/layout :: sortHeader(#{clan.col.lastSeen}, 'lastSeen', ${clanPathTag}, ${sortBy}, ${sortDir})}"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="member : ${members}">
                            <!--/* スマホ幅では1人の行が長くならないよう、順位の列は隠して名前の前に出す(member-rank)。 */-->
                            <td class="cell-rank" th:attr="data-label=#{clan.col.rank}" th:text="${member.clanRank()}"></td>
                            <td th:attr="data-label=#{clan.col.name}"><span><span class="member-rank" th:if="${member.clanRank() != null}" th:text="${member.clanRank()} + '.'"></span><a th:href="@{/player/{tag}(tag=${member.pathTag()})}"><bdi th:text="${member.name()}"></bdi></a></span><span class="world-rank-badge" th:if="${member.worldRank() != null}" th:text="#{player.ranked.rank(${member.worldRank()})}"></span></td>
                            <td th:attr="data-label=#{clan.col.role}" th:text="${member.role()}"></td>
                            <td class="num" th:attr="data-label=#{clan.col.trophies}" th:text="${#numbers.formatInteger(member.trophies(), 1, 'DEFAULT')}"></td>
                            <td class="num" th:attr="data-label=#{clan.col.donations}" th:text="${#numbers.formatInteger(member.donations(), 1, 'DEFAULT')}"></td>
                            <!--/* 長期間アクセスの無いメンバーは、クランの整理対象を探しやすいよう警告色で目立たせる */-->
                            <td th:attr="data-label=#{clan.col.lastSeen}" th:with="lastSeen=${member.lastSeenIso()}"
                                th:switch="${member.inactiveDays()}">
                                <span th:case="null" th:text="#{clan.lastSeen.unknown}"></span>
                                <time th:case="0" th:datetime="${lastSeen}" th:text="#{clan.lastSeen.today}"></time>
                                <time th:case="*" th:datetime="${lastSeen}"
                                      th:classappend="${member.longInactive()} ? 'inactive-badge'"
                                      th:text="#{clan.lastSeen.ago(${member.inactiveDays()})}"></time>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-notes">
                <p th:replace="~{fragments/layout :: notice(#{clan.rankNotice})}"></p>
                <p th:replace="~{fragments/layout :: notice(#{clan.donationNotice})}"></p>
                <p th:replace="~{fragments/layout :: notice(#{clan.lastSeenNotice})}"></p>
            </div>
        </div>

        <!--/* 加入を考える人が「対戦で勝てているクランか」を見られるように、過去の対戦の順位を週ごとに出す */-->
        <div class="card" id="war-history">
            <h2 th:text="#{clanWarLog.heading}"></h2>
            <p th:if="${warHistoryErrorKey}" class="error-box" th:text="#{${warHistoryErrorKey}}"></p>
            <p th:if="${warHistory != null and #lists.isEmpty(warHistory.weeks())}" class="empty-state" th:text="#{clanWarLog.none}"></p>
            <th:block th:if="${warHistory != null and not #lists.isEmpty(warHistory.weeks())}">
                <!--/* 1位が無いクランに「0 / 10週」と出すと加入を考える人に悪く見えるだけなので、表だけにする */-->
                <ul class="stat-grid" th:if="${warHistory.firstPlaces() > 0}">
                    <li><span class="label" th:text="#{clanWarLog.firstPlaces}"></span><span class="value" th:text="#{clanWarLog.firstPlaces.value(${warHistory.firstPlaces()}, ${#lists.size(warHistory.weeks())})}"></span></li>
                    <li th:if="${warHistory.firstPlaceStreak() >= 2}"><span class="label" th:text="#{clanWarLog.streak}"></span><span class="value" th:text="#{clanWarLog.streak.value(${warHistory.firstPlaceStreak()})}"></span></li>
                </ul>
                <p th:replace="~{fragments/layout :: notice(#{clanWarLog.notice})}"></p>
                <div class="table-scroll">
                    <table class="table-compact">
                        <thead>
                            <tr>
                                <th th:text="#{clanWarLog.col.ended}"></th>
                                <th class="num" th:text="#{ranking.col.rank}"></th>
                                <th class="num" th:text="#{clanWarLog.col.medals}"></th>
                                <th class="num" th:text="#{ranking.col.warTrophies}"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="w : ${warHistory.weeks()}">
                                <td th:text="${w.endedOn()}"></td>
                                <td class="num"><strong th:if="${w.firstPlace()}" th:text="${w.rank()}"></strong><span th:unless="${w.firstPlace()}" th:text="${w.rank() != null ? w.rank() : '—'}"></span></td>
                                <td class="num" th:text="${#numbers.formatInteger(w.medals(), 1, 'DEFAULT')}"></td>
                                <td class="num"><span class="movement" th:classappend="${w.trophyChangeClass()}" th:text="${w.trophyChange()}"></span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </th:block>
        </div>

        <div class="card" id="war">
            <h2 th:text="#{clanWar.heading}"></h2>
            <p th:if="${warErrorKey}" class="error-box" th:text="#{${warErrorKey}}"></p>
            <p th:if="${warNotParticipating}" class="empty-state" th:text="#{clanWar.notParticipating}"></p>
            <p th:if="${war != null and not war.battleDay()}" class="empty-state" th:text="#{clanWar.noBattleDay}"></p>
            <th:block th:if="${war != null and war.battleDay()}">
                <ul class="stat-grid">
                    <li><span class="label" th:text="#{clanWar.today.members}"></span><span class="value" th:text="#{clanWar.ratio(${war.membersBattledToday()}, ${war.memberCount()})}"></span></li>
                    <li><span class="label" th:text="#{clanWar.today.decks}"></span><span class="value" th:text="#{clanWar.ratio(${war.decksUsedToday()}, ${war.maxDecksToday()})}"></span></li>
                </ul>
                <p th:replace="~{fragments/layout :: notice(#{clanWar.notice})}"></p>
                <div class="table-scroll" th:unless="${#lists.isEmpty(war.members())}">
                    <!--/* 列が少ないので、スマホでもカード型にせず表のまま出す(1人1行で50人を見渡せるように) */-->
                    <table class="table-compact">
                        <thead>
                            <tr>
                                <th th:text="#{clan.col.name}"></th>
                                <th class="num" th:text="#{clanWar.col.today}"></th>
                                <th class="num" th:text="#{clanWar.col.week}"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${war.members()}">
                                <td><a th:href="@{/player/{tag}(tag=${m.pathTag()})}"><bdi th:text="${m.name()}"></bdi></a></td>
                                <td class="num"><span th:classappend="${m.notBattledToday()} ? 'inactive-badge'"
                                                      th:text="#{clanWar.ratio(${m.decksUsedToday()}, ${war.decksPerDay()})}"></span></td>
                                <td class="num" th:text="${m.decksUsedThisWeek()}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!--/* 今週1回も攻撃していない人は、表に1人1行ずつ並べず名前だけを詰めて出す(どちらも今日は0 / 4) */-->
                <th:block th:unless="${#lists.isEmpty(war.notAttackedThisWeek())}">
                    <h3 th:text="#{clanWar.notAttacked(${#lists.size(war.notAttackedThisWeek())})}"></h3>
                    <p class="name-list war-not-attacked">
                        <a th:each="m : ${war.notAttackedThisWeek()}" th:href="@{/player/{tag}(tag=${m.pathTag()})}"><bdi th:text="${m.name()}"></bdi></a>
                    </p>
                </th:block>
            </th:block>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script th:replace="~{fragments/layout :: recentViewsScript('clan', ${clanPathTag}, ${clanName})}"></script>
</body>
</html>
