# --- Privacy policy (English and Japanese only; other languages fall back to this English text) ---
privacy.languageNote=This policy is available in English and Japanese.
privacy.effective=Effective date: October 4, 2026
privacy.intro=Princess Tower ("this site") is an unofficial fan site that uses the official Clash Royale API provided by Supercell. This policy explains what information this site handles and how.
privacy.collect.heading=Information this site records
privacy.collect.logs=Server logs: when a page is shown, the server records the IP address, date and time, the page URL, the referring page and the browser type (user agent). They are used to investigate problems and to count visits, and are deleted after about five weeks.
privacy.collect.beacon=Page view count: each page sends this site only its own path and, if present, the source tag added to links shared by this site (such as ?from=x). No cookie or other value that identifies you is sent. It is recorded in the server logs above and used only to count page views.
privacy.collect.players=Player information: for the name search, this site stores the tags and names of players it has seen through the official API or on its pages. These are shown publicly in the game. If you would like your player information removed, please contact us below.
privacy.storage.heading=Cookies and data stored in your browser
privacy.storage.cookies=Cookies: your favorites (fav_players, fav_clans), the language you chose in the language menu (lang) and the country or region you chose in the rankings (country). They are used only for these features of this site, expire after one year and are never used for advertising or for tracking you on other sites.
privacy.storage.local=Browser storage (localStorage and sessionStorage): to show what changed since your last visit on player pages, the trophies and other values of up to 100 recently viewed players are kept in localStorage. A timestamp used to keep the favorites list up to date is kept temporarily in sessionStorage. This data stays in your browser and is never sent to this site.
privacy.storage.control=You can delete or block cookies and browser storage in your browser settings. Favorites and similar features will then stop working.
privacy.external.heading=External services
privacy.external.images=Card images are loaded by your browser directly from Supercell's servers (api-assets.clashroyale.com), so your IP address and similar information are sent to Supercell.
privacy.external.share=The "Share on X" button opens the post screen of X (formerly Twitter). Nothing is sent to X unless you press it.
privacy.external.analytics=This site currently uses no external advertising or analytics services (such as Google Analytics). This page will be updated before any are introduced.
privacy.thirdParty.heading=Sharing with third parties
privacy.thirdParty.body=This site does not provide the information it records to third parties, except where required by law.
privacy.changes.heading=Changes to this policy
privacy.changes.body=When this policy changes, the new version will be posted on this page.
privacy.contact.heading=Contact
privacy.contact.body=Please send a direct message on X:
