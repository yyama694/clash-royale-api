about.intro=Princess Tower — неофициальный фанатский сайт для игроков Clash Royale со всего мира. Он использует официальный API Clash Royale от Supercell, чтобы показывать информацию об игроках и кланах, рейтинги, частоту использования карт и колоды лучших игроков.
about.operator.heading=Кто ведёт сайт
about.operator.body=Сайт ведёт частное лицо из Японии как личный проект. Его ведёт не компания, и он никак не связан с Supercell.
about.data.heading=О данных
about.data.body=Все игровые данные берутся из официального API. Информация об игроках и кланах обновляется каждые несколько минут, а колоды лучших игроков и частота использования карт собираются раз в сутки. Если что-то выглядит неверно, сообщите нам.
about.contact.heading=Контакты
about.contact.body=Чтобы сообщить об ошибке, предложить новую функцию или попросить удалить информацию о вашем игроке, напишите нам в личные сообщения в X:
