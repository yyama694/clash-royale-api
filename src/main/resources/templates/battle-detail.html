<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{battle.pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container container-wide">
        <a class="back-link" th:href="@{/player/{tag}(tag=${playerPathTag})}">&laquo; <span th:text="#{action.backToPlayer}"></span></a>

        <div class="card">
            <h1 th:text="#{battle.pageTitle}"></h1>
            <p class="notice">
                <time th:replace="~{fragments/layout :: localTime(${battle.time()})}"></time>
                <span th:text="' / ' + ${battle.gameMode()}"></span>
            </p>

            <div class="matchup">
                <div th:replace="~{fragments/layout :: matchupSide(${battle.team()})}"></div>
                <div class="vs" th:text="#{battle.vs}"></div>
                <div th:replace="~{fragments/layout :: matchupSide(${battle.opponents()})}"></div>
            </div>
        </div>

        <!--/*
          自分側を左列、相手側を右列に置き、2v2の2人目どうしが同じ行に並ぶよう --row で行を指定する。
          左右を別々に縦積みすると、カード名の折り返し行数の違いで2段目の位置が左右でずれるため。
          スマホでは1列に戻し、自分→味方→相手の順(DOMの順)に並べる。
          teamは本人が先頭になるようViewMapperで並べ替え済みなので、本人以外は「味方」になる。
        */-->
        <div class="decks">
            <div class="card deck-panel deck-panel-team" th:each="p, iter : ${battle.team()}"
                 th:style="'--row: ' + ${iter.count}">
                <h2 th:text="${p.viewer()} ? #{battle.deck.team(${p.name()})} : #{battle.deck.teammate(${p.name()})}"></h2>
                <div th:replace="~{fragments/layout :: deckGrid(${p.cards()})}"></div>
                <th:block th:if="${not #lists.isEmpty(p.supportCards())}">
                    <div th:replace="~{fragments/layout :: supportCardRow(#{battle.supportCards}, ${p.supportCards()})}"></div>
                </th:block>
            </div>
            <div class="card deck-panel deck-panel-opponent" th:each="p, iter : ${battle.opponents()}"
                 th:style="'--row: ' + ${iter.count}">
                <h2 th:text="#{battle.deck.opponent(${p.name()})}"></h2>
                <div th:replace="~{fragments/layout :: deckGrid(${p.cards()})}"></div>
                <th:block th:if="${not #lists.isEmpty(p.supportCards())}">
                    <div th:replace="~{fragments/layout :: supportCardRow(#{battle.supportCards}, ${p.supportCards()})}"></div>
                </th:block>
            </div>
        </div>
    </main>
</body>
</html>
