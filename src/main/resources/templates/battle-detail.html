<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>対戦詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <a class="back-link" th:href="@{/player(tag=${tag})}">&laquo; プレイヤー情報に戻る</a>

        <div th:if="${error}" class="error-box" th:text="${error}"></div>

        <div th:if="${battle}" class="card">
            <h1>対戦詳細</h1>
            <p class="notice" th:text="${battle.battleTime()} + ' / ' + ${T(com.example.clashroyaleapi.web.GameModeLabels).label(battle.gameMode() != null ? battle.gameMode().name() : null)}"></p>

            <div class="matchup">
                <div class="side">
                    <div class="side-name" th:text="${battle.team()[0].name()}"></div>
                    <span th:if="${battle.team()[0].crowns() > battle.opponent()[0].crowns()}" class="badge badge-win">勝ち</span>
                    <span th:if="${battle.team()[0].crowns() < battle.opponent()[0].crowns()}" class="badge badge-lose">負け</span>
                    <span th:if="${battle.team()[0].crowns() == battle.opponent()[0].crowns()}" class="badge badge-draw">引き分け</span>
                    <div th:text="${battle.team()[0].crowns()} + ' クラウン'"></div>
                </div>
                <div class="vs">VS</div>
                <div class="side">
                    <div class="side-name" th:text="${battle.opponent()[0].name()}"></div>
                    <span th:if="${battle.opponent()[0].crowns() > battle.team()[0].crowns()}" class="badge badge-win">勝ち</span>
                    <span th:if="${battle.opponent()[0].crowns() < battle.team()[0].crowns()}" class="badge badge-lose">負け</span>
                    <span th:if="${battle.opponent()[0].crowns() == battle.team()[0].crowns()}" class="badge badge-draw">引き分け</span>
                    <div th:text="${battle.opponent()[0].crowns()} + ' クラウン'"></div>
                </div>
            </div>
        </div>

        <div th:if="${battle}" class="card">
            <h2 th:text="'自分のデッキ(' + ${battle.team()[0].name()} + ')'"></h2>
            <div class="deck-grid">
                <div class="deck-card" th:each="c : ${battle.team()[0].cards()}">
                    <img th:if="${c.iconUrls() != null}" th:src="${c.iconUrls().medium()}" th:alt="${c.name()}">
                    <div class="card-name" th:text="${T(com.example.clashroyaleapi.web.CardNameLabels).label(c.name(), useJapaneseCardNames)}"></div>
                    <div class="card-level" th:text="'Lv.' + ${c.level()}"></div>
                </div>
            </div>
            <h3 th:if="${!#lists.isEmpty(battle.team()[0].supportCards())}">プリンセスタワーカード</h3>
            <div class="deck-grid" th:if="${!#lists.isEmpty(battle.team()[0].supportCards())}">
                <div class="deck-card" th:each="c : ${battle.team()[0].supportCards()}">
                    <img th:if="${c.iconUrls() != null}" th:src="${c.iconUrls().medium()}" th:alt="${c.name()}">
                    <div class="card-name" th:text="${T(com.example.clashroyaleapi.web.CardNameLabels).label(c.name(), useJapaneseCardNames)}"></div>
                    <div class="card-level" th:text="'Lv.' + ${c.level()}"></div>
                </div>
            </div>
        </div>

        <div th:if="${battle}" class="card">
            <h2 th:text="'相手のデッキ(' + ${battle.opponent()[0].name()} + ')'"></h2>
            <div class="deck-grid">
                <div class="deck-card" th:each="c : ${battle.opponent()[0].cards()}">
                    <img th:if="${c.iconUrls() != null}" th:src="${c.iconUrls().medium()}" th:alt="${c.name()}">
                    <div class="card-name" th:text="${T(com.example.clashroyaleapi.web.CardNameLabels).label(c.name(), useJapaneseCardNames)}"></div>
                    <div class="card-level" th:text="'Lv.' + ${c.level()}"></div>
                </div>
            </div>
            <h3 th:if="${!#lists.isEmpty(battle.opponent()[0].supportCards())}">プリンセスタワーカード</h3>
            <div class="deck-grid" th:if="${!#lists.isEmpty(battle.opponent()[0].supportCards())}">
                <div class="deck-card" th:each="c : ${battle.opponent()[0].supportCards()}">
                    <img th:if="${c.iconUrls() != null}" th:src="${c.iconUrls().medium()}" th:alt="${c.name()}">
                    <div class="card-name" th:text="${T(com.example.clashroyaleapi.web.CardNameLabels).label(c.name(), useJapaneseCardNames)}"></div>
                    <div class="card-level" th:text="'Lv.' + ${c.level()}"></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
