<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 全画面で同一だった <head> をまとめる。titleは各画面から渡す。 -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{title.format(${title}, #{app.name})}"></title>
    <meta name="description" th:content="#{app.description}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!--/*
      同じURLでもCookieやAccept-Languageで返す言語が変わるため、検索エンジンには言語ごとのURLを明示する。
      hreflangは絶対URLでないと解釈されないので、アクセスされたホストを付ける。
    */-->
    <th:block th:if="${siteBaseUrl != null and currentUri != null}" th:with="pageUrl=${siteBaseUrl + currentUri}">
        <link rel="alternate" hreflang="ja" th:href="@{${pageUrl}(lang='ja')}">
        <link rel="alternate" hreflang="en" th:href="@{${pageUrl}(lang='en')}">
        <link rel="alternate" hreflang="x-default" th:href="@{${pageUrl}}">
    </th:block>
    <!--
      公式APIの日時は常にUTCで、閲覧者のタイムゾーンはサーバーからは分からない。そのため変換はブラウザに任せる。
      スクリプトが動かない場合は、サーバーが入れたUTC表記がそのまま残る。
    -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var format = new Intl.DateTimeFormat(document.documentElement.lang,
                {dateStyle: 'medium', timeStyle: 'short'});
            document.querySelectorAll('time[data-localtime][datetime]').forEach(function (element) {
                var value = new Date(element.getAttribute('datetime'));
                if (!isNaN(value.getTime())) {
                    element.textContent = format.format(value);
                }
            });
        });
    </script>
    <!--
      戻るリンク(.back-link)を「ひとつ前の画面」に戻す。行き先はブラウザの履歴に任せ(history.back)、
      文言だけ直前のページのパスから決める。サーバーから戻り先を決めると、戻った先の画面でも
      「さっきの画面に戻る」が出て2画面の往復になるため。
      履歴が無い(直接開いた・新しいタブで開いた)ときは、サーバーが出したリンクをそのまま使う。

      言語切替・並べ替え・国選択のようにパスが同じでクエリだけ変わる遷移は、履歴を積まずに置き換える。
      積むと「戻る」が同じ画面の切替前に戻ってしまうため。置き換えた後は referrer が自分自身になるので、
      画面に入ってきたときの直前のパスを sessionStorage に覚えておき、それを使う。
    -->
    <script th:inline="javascript">
        (function () {
            var labels = {
                top: /*[[#{action.backToTop}]]*/ '',
                playerRanking: /*[[#{action.backToPlayerRanking}]]*/ '',
                clanRanking: /*[[#{action.backToClanRanking}]]*/ '',
                battle: /*[[#{action.backToBattle}]]*/ '',
                player: /*[[#{action.backToPlayer}]]*/ '',
                clanSearch: /*[[#{action.backToClanSearch}]]*/ '',
                clan: /*[[#{action.backToClan}]]*/ '',
                card: /*[[#{action.backToCard}]]*/ '',
                cards: /*[[#{action.backToCards}]]*/ '',
                other: /*[[#{action.back}]]*/ ''
            };
            // 上から順に判定する(/player/{tag} より /player/{tag}/battles/{time} を先に)。
            // [/ はThymeleafのインライン記法(閉じ要素)と解釈されるため、配列ではなくオブジェクトで持つ。
            var screens = [
                {pattern: /^\/$/, screen: 'top'},
                {pattern: /^\/ranking\/players$/, screen: 'playerRanking'},
                {pattern: /^\/ranking$/, screen: 'clanRanking'},
                {pattern: /^\/player\/[^/]+\/battles\/[^/]+$/, screen: 'battle'},
                {pattern: /^\/player\/[^/]+$/, screen: 'player'},
                {pattern: /^\/clan\/search$/, screen: 'clanSearch'},
                {pattern: /^\/clan\/[^/]+$/, screen: 'clan'},
                {pattern: /^\/card\/[^/]+$/, screen: 'card'},
                {pattern: /^\/cards$/, screen: 'cards'}
            ];
            var storageKey = 'backFrom:' + location.pathname;

            function sameOrigin(href) {
                try {
                    var url = new URL(href, location.href);
                    return url.origin === location.origin ? url : null;
                } catch (e) {
                    return null;
                }
            }
            function storage(action) {
                try {
                    return action(window.sessionStorage);
                } catch (e) {
                    return null;
                }
            }

            var referrer = document.referrer ? sameOrigin(document.referrer) : null;
            var backFrom = null;
            if (referrer && referrer.pathname === location.pathname) {
                backFrom = storage(function (s) { return s.getItem(storageKey); });
            } else {
                if (referrer) {
                    // hrefにも使うので、別タブで開いたときに言語が切り替わらないよう lang は落とす。
                    referrer.searchParams.delete('lang');
                    backFrom = referrer.pathname + referrer.search;
                }
                storage(function (s) {
                    if (backFrom) {
                        s.setItem(storageKey, backFrom);
                    } else {
                        s.removeItem(storageKey);
                    }
                });
            }

            // 戻った先はブラウザのキャッシュから復元されるため、途中で言語を切り替えていると古い言語のまま出る。
            // 最後に表示した言語を覚えておき、履歴で戻ってきて食い違っていたら読み直す。
            function languageChanged() {
                var last = storage(function (s) { return s.getItem('lastLang'); });
                return last && last !== document.documentElement.lang;
            }
            // URLに ?lang= が残っているとそちらが優先されて元の言語に戻るため、外してから開き直す。
            function reloadWithoutLangParam() {
                var url = new URL(location.href);
                url.searchParams.delete('lang');
                location.replace(url.href);
            }
            function rememberLanguage() {
                storage(function (s) { s.setItem('lastLang', document.documentElement.lang); });
            }
            var navigation = performance.getEntriesByType('navigation')[0];
            if (navigation && navigation.type === 'back_forward' && languageChanged()) {
                reloadWithoutLangParam();
                return;
            }
            rememberLanguage();
            window.addEventListener('pageshow', function (event) {
                if (event.persisted && languageChanged()) {
                    reloadWithoutLangParam();
                }
            });

            function isPlainClick(event) {
                return event.button === 0 && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey;
            }

            document.addEventListener('click', function (event) {
                if (event.defaultPrevented || !isPlainClick(event)) {
                    return;
                }
                var link = event.target.closest('a[href]');
                if (!link || link.target || link.hasAttribute('download')) {
                    return;
                }
                var url = sameOrigin(link.href);
                // ページ内リンク(#だけ違う)はブラウザに任せる。
                if (!url || url.pathname !== location.pathname || url.search === location.search) {
                    return;
                }
                event.preventDefault();
                location.replace(url.href);
            });

            document.addEventListener('submit', function (event) {
                var form = event.target;
                var url = sameOrigin(form.action);
                if (event.defaultPrevented || form.method.toLowerCase() !== 'get'
                        || !url || url.pathname !== location.pathname) {
                    return;
                }
                event.preventDefault();
                url.search = new URLSearchParams(new FormData(form)).toString();
                location.replace(url.href);
            });

            document.addEventListener('DOMContentLoaded', function () {
                var link = document.querySelector('a.back-link');
                if (!link || !backFrom || history.length < 2) {
                    return;
                }
                var path = backFrom.split('?')[0];
                var match = screens.find(function (entry) { return entry.pattern.test(path); });
                link.querySelector('span').textContent = labels[match ? match.screen : 'other'];
                // 新しいタブで開かれた場合に備えて、hrefも直前の画面にしておく。
                link.setAttribute('href', backFrom);
                link.addEventListener('click', function (event) {
                    if (!isPlainClick(event)) {
                        return;
                    }
                    event.preventDefault();
                    history.back();
                });
            });
        })();
    </script>
</head>

<!-- ランキング画面へはトップページを経由しないと行けなかったため、どの画面からも移動できるようヘッダーにメニューを置く。 -->
<header class="site-header" th:fragment="header">
    <a class="brand" th:href="@{/}" th:text="#{app.name}"></a>
    <nav class="site-nav" th:aria-label="#{nav.main}">
        <a th:href="@{/}" th:text="#{nav.search}"></a>
        <a th:href="@{/ranking/players}" th:text="#{nav.playerRanking}"></a>
        <a th:href="@{/ranking}" th:text="#{nav.clanRanking}"></a>
        <a th:href="@{/cards}" th:text="#{nav.cards}"></a>
    </nav>
    <nav class="lang-switch" th:aria-label="#{nav.language}">
        <!--/* リンク文字列は常にその言語自身の表記なので、読み上げが正しい言語になるようlangを付ける。 */-->
        <a th:href="@{${currentUri}(lang='ja')}" th:text="#{lang.ja}" lang="ja" hreflang="ja"
           th:classappend="${#locale.language == 'ja'} ? 'is-active'"></a>
        <a th:href="@{${currentUri}(lang='en')}" th:text="#{lang.en}" lang="en" hreflang="en"
           th:classappend="${#locale.language != 'ja'} ? 'is-active'"></a>
    </nav>
</header>

<!-- トップページと、見つからなかったときの画面で共用する検索フォーム。value は再検索時に入力値を残すために使う。 -->
<div th:fragment="playerSearchForm(value)" class="card">
    <h2 th:text="#{home.player.heading}"></h2>
    <form class="search-form" th:action="@{/player/search}" method="get">
        <label>
            <span th:text="#{home.player.label}"></span>
            <input type="text" name="q" required th:value="${value}" th:placeholder="#{home.player.placeholder}">
        </label>
        <button type="submit" th:text="#{action.search}"></button>
    </form>
</div>

<div th:fragment="clanSearchForm(value)" class="card">
    <h2 th:text="#{home.clan.heading}"></h2>
    <form class="search-form" th:action="@{/clan/search}" method="get">
        <label>
            <span th:text="#{home.clan.label}"></span>
            <input type="text" name="q" required th:value="${value}" th:placeholder="#{home.clan.placeholder}">
        </label>
        <button type="submit" th:text="#{action.search}"></button>
    </form>
</div>

<!--
  日時。datetime にはUTCのISO形式を入れ、表示文字列はブラウザ側で閲覧者の時刻に書き換わる。
  APIの値を解釈できなかった場合は iso が null になり、datetime 属性ごと出ない(書き換えの対象にもならない)。
-->
<time th:fragment="localTime(time)" data-localtime th:datetime="${time.iso()}" th:text="${time.text()}"></time>

<!-- 注記。先頭の記号は言語ごとに違うため、テンプレートに直書きせずメッセージ側に持つ。 -->
<p th:fragment="notice(text)" class="notice" th:text="#{notice.format(${text})}"></p>

<!-- 勝敗バッジ。判定はViewModel側で済ませてあるので、ここは表示のみ。 -->
<span th:fragment="resultBadge(result)" class="badge"
      th:classappend="'badge-' + ${result.code()}"
      th:text="#{'battle.result.' + ${result.code()}}"></span>

<!--
  カード画像から詳細画面へのリンク。カード名はすぐ下に出ているので alt は空にし、
  リンクの読み上げには aria-label を使う(同じ名前を二度読ませないため)。
-->
<a th:fragment="cardLink(id, name, iconUrl)" th:if="${iconUrl != null}" class="card-link"
   th:href="@{/card/{id}(id=${id})}" th:aria-label="#{card.detail.link(${name})}">
    <img th:src="${iconUrl}" alt="" width="285" height="420" loading="lazy">
</a>

<!--
  カード画像は width/height を指定し、読み込み前から枠の大きさを確保する(遅延読み込みの間に配置がガタつくため)。
  公式APIのカード画像は 285x420 で統一されている。
-->
<div th:fragment="deckGrid(cards)" class="deck-grid">
    <div class="deck-card" th:each="c : ${cards}">
        <a th:replace="~{fragments/layout :: cardLink(${c.id()}, ${c.name()}, ${c.iconUrl()})}"></a>
        <div class="card-name" th:text="${c.name()}"></div>
        <div class="card-sub" th:text="#{battle.level(${c.level()})}"></div>
    </div>
</div>

<!-- 得意/苦手カード。kind(good/bad)で枠と勝率の色を変え、見出しを読まなくても強弱が伝わるようにする。 -->
<div th:fragment="performanceGrid(cards, kind)" class="deck-grid">
    <div class="deck-card" th:each="c : ${cards}" th:classappend="'perf-' + ${kind}">
        <a th:replace="~{fragments/layout :: cardLink(${c.cardId()}, ${c.name()}, ${c.iconUrl()})}"></a>
        <div class="card-name" th:text="${c.name()}"></div>
        <div class="card-sub perf-rate" th:text="#{stats.record(${c.winRatePercent()}, ${c.wins()}, ${c.uses()})}"></div>
    </div>
</div>

<!-- タワーユニットは通常1枚のみのため、deckGridだと1枚が横幅いっぱいに伸びてしまう。ラベルと横並びの小さい行で表示する。 -->
<div th:fragment="supportCardRow(label, cards)" class="support-row">
    <span class="support-label" th:text="${label}"></span>
    <div class="support-card" th:each="c : ${cards}">
        <a th:replace="~{fragments/layout :: cardLink(${c.id()}, ${c.name()}, ${c.iconUrl()})}"></a>
        <span class="card-name" th:text="${c.name()}"></span>
        <span class="card-sub" th:text="#{battle.level(${c.level()})}"></span>
    </div>
</div>

<!--
  デッキの平均エリクサー・4枚サイクルとコピーボタン。求められない項目はViewMapperでnullにしてあり、その項目だけ出さない。
  コピーのリンクはゲームを起動するため、今のページを残せるよう別タブで開く。
-->
<div th:fragment="deckMeta(meta)" class="deck-meta"
     th:if="${meta.averageElixir() != null or meta.copyUrl() != null}">
    <span class="deck-metric" th:if="${meta.averageElixir() != null}">
        <span class="deck-metric-label" th:text="#{deck.averageElixir}"></span>
        <span class="deck-metric-value" th:text="${#numbers.formatDecimal(meta.averageElixir(), 1, 1)}"></span>
    </span>
    <span class="deck-metric" th:if="${meta.fourCardCycle() != null}">
        <span class="deck-metric-label" th:text="#{deck.fourCardCycle}"></span>
        <span class="deck-metric-value" th:text="${meta.fourCardCycle()}"></span>
    </span>
    <a th:if="${meta.copyUrl() != null}" class="btn btn-secondary btn-small deck-copy" th:href="${meta.copyUrl()}"
       th:title="#{deck.copy.title}" target="_blank" rel="noopener noreferrer" th:text="#{deck.copy}"></a>
</div>

<!-- 対戦詳細の片側。2v2では参加者が2人になるためリストで受け取る。見ているプレイヤー本人は強調する。 -->
<div th:fragment="matchupSide(side)" class="side">
    <div class="side-name" th:each="p : ${side}" th:classappend="${p.viewer()} ? 'is-viewer'">
        <a th:href="@{/player/{tag}(tag=${p.pathTag()})}"><bdi th:text="${p.name()}"></bdi></a>
    </div>
    <span th:replace="~{fragments/layout :: resultBadge(${side[0].result()})}"></span>
    <div th:text="#{battle.crowns(${side[0].crowns()})}"></div>
</div>

<!--
  クランメンバー一覧のソート用ヘッダ。同じ列をクリックすると昇順/降順が反転する。
  リンク先に #members を付けるのは、ページ遷移後に先頭へ戻ると(特にスマホで)一覧が画面外に出てしまうため。
-->
<th th:fragment="sortHeader(label, key, tag, sortBy, sortDir)" class="sortable"
    th:classappend="${key == 'trophies' or key == 'donations'} ? 'num'"
    th:attr="aria-sort=${sortBy == key} ? (${sortDir == 'asc'} ? 'ascending' : 'descending') : null">
    <a th:href="@{/clan/{tag}(tag=${tag}, sortBy=${key}, sortDir=(${sortBy == key and sortDir == 'asc'} ? 'desc' : 'asc'))} + '#members'"
       th:classappend="${sortBy == key} ? (${sortDir == 'asc'} ? 'sort-asc' : 'sort-desc') : 'sort-none'"
       th:text="${label}"></a>
</th>

<!-- クランランキングの表。グローバル/ローカルの両タブで共用する(国の列はグローバルのみ)。 -->
<div th:fragment="rankingTable(rows, showLocation)">
    <p th:if="${rows.isEmpty()}" class="notice" th:text="#{ranking.unavailable}"></p>
    <div th:unless="${rows.isEmpty()}" class="table-scroll">
        <table class="table-ranking">
            <thead>
                <tr>
                    <th th:text="#{ranking.col.rank}"></th>
                    <th th:text="#{ranking.col.clan}"></th>
                    <th th:if="${showLocation}" th:text="#{ranking.col.location}"></th>
                    <th class="num" th:text="#{ranking.col.score}"></th>
                    <th class="num" th:text="#{ranking.col.members}"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${rows}">
                    <td class="cell-rank" th:attr="data-label=#{ranking.col.rank}"><span class="rank" th:text="${row.rank()}"></span></td>
                    <td class="cell-name" th:attr="data-label=#{ranking.col.clan}">
                        <a th:href="@{/clan/{tag}(tag=${row.pathTag()})}"><bdi th:text="${row.name()}"></bdi></a>
                    </td>
                    <td th:if="${showLocation}" th:attr="data-label=#{ranking.col.location}" th:text="${row.locationName()}"></td>
                    <td class="num" th:attr="data-label=#{ranking.col.score}"
                        th:text="${#numbers.formatInteger(row.clanScore(), 1, 'DEFAULT')}"></td>
                    <td class="num" th:attr="data-label=#{ranking.col.members}" th:text="${row.members()}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 個人ランキングの表。トップページの概要(detailed=false)と詳細画面(detailed=true)で共用する。 -->
<div th:fragment="playerRankingTable(rows, detailed)">
    <p th:if="${rows.isEmpty()}" class="notice" th:text="#{ranking.unavailable}"></p>
    <div th:unless="${rows.isEmpty()}" class="table-scroll">
        <table class="table-ranking">
            <thead>
                <tr>
                    <th th:text="#{ranking.col.rank}"></th>
                    <th th:text="#{playerRanking.col.player}"></th>
                    <th th:if="${detailed}" th:text="#{playerRanking.col.level}"></th>
                    <th class="num" th:text="#{playerRanking.col.rating}"></th>
                    <th th:if="${detailed}" th:text="#{playerRanking.col.clan}"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${rows}">
                    <td class="cell-rank" th:attr="data-label=#{ranking.col.rank}"><span class="rank" th:text="${row.rank()}"></span></td>
                    <td class="cell-name" th:attr="data-label=#{playerRanking.col.player}">
                        <a th:href="@{/player/{tag}(tag=${row.pathTag()})}"><bdi th:text="${row.name()}"></bdi></a>
                    </td>
                    <td th:if="${detailed}" th:attr="data-label=#{playerRanking.col.level}"
                        th:text="#{battle.level(${row.expLevel()})}"></td>
                    <td class="num" th:attr="data-label=#{playerRanking.col.rating}"
                        th:text="${#numbers.formatInteger(row.eloRating(), 1, 'DEFAULT')}"></td>
                    <!-- クラン未所属の人は、スマホのカード表示で「クラン」の見出しだけが空で残らないよう is-empty を付ける。 -->
                    <td th:if="${detailed}" th:attr="data-label=#{playerRanking.col.clan}"
                        th:classappend="${row.clanName() == null} ? 'is-empty'">
                        <a th:if="${row.clanName() != null}" th:href="@{/clan/{tag}(tag=${row.clanPathTag()})}">
                            <bdi th:text="${row.clanName()}"></bdi></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!--
  グローバル/国別のタブ。クランランキングと個人ランキングで共用するため、中身の表は呼び出し側から
  フラグメント式で受け取る。選択中の国(selectedCountry等)はモデルから直接参照する。
  切り替えは表示/非表示の入れ替えだけで、サーバーへの再取得は行わない。
-->
<div th:fragment="rankingTabs(globalPanel, localPanel, formAction, lazyUrl)" class="ranking-tabs"
     th:attr="data-loading-text=#{ranking.loading},data-error-text=#{ranking.unavailable}">
    <div class="tabs" role="tablist" th:aria-label="#{ranking.tabs.label}">
        <button type="button" class="tab" role="tab" id="tab-global" aria-controls="panel-global"
                th:classappend="${localTabActive} ? '' : 'is-active'"
                th:attr="aria-selected=${!localTabActive},tabindex=${localTabActive} ? '-1' : '0'"
                th:text="#{ranking.tab.global}"></button>
        <button type="button" class="tab" role="tab" id="tab-local" aria-controls="panel-local"
                th:if="${selectedCountry != null}"
                th:classappend="${localTabActive} ? 'is-active' : ''"
                th:attr="aria-selected=${localTabActive},tabindex=${localTabActive} ? '0' : '-1'"
                th:text="${selectedCountryName}"></button>
    </div>
    <!--/*
      ranking-slot が表の入る場所。lazyUrl を渡した画面では、最初は開いているタブの表だけを描き、
      もう一方には data-lazy-url だけを置く(件数が多い画面でHTMLが倍になるのを避けるため)。
      lazyUrl が無ければ今までどおり両方を描く。
    */-->
    <div id="panel-global" role="tabpanel" aria-labelledby="tab-global"
         th:attr="hidden=${localTabActive} ? 'hidden' : null">
        <div class="ranking-slot"
             th:attr="data-lazy-url=${lazyUrl != null and localTabActive} ? @{${lazyUrl}} : null">
            <th:block th:if="${lazyUrl == null or !localTabActive}" th:insert="${globalPanel}"></th:block>
        </div>
    </div>
    <th:block th:if="${selectedCountry != null}">
        <div id="panel-local" role="tabpanel" aria-labelledby="tab-local"
             th:attr="hidden=${localTabActive} ? null : 'hidden'">
            <form class="country-form" th:action="@{${formAction}}" method="get">
                <label>
                    <span th:text="#{ranking.country.label}"></span>
                    <select name="country">
                        <option th:each="c : ${countries}" th:value="${c.code()}" th:text="${c.name()}"
                                th:selected="${c.code() == selectedCountry}"></option>
                    </select>
                </label>
                <button type="submit" th:text="#{ranking.country.apply}"></button>
            </form>
            <div class="ranking-slot"
                 th:attr="data-lazy-url=${lazyUrl != null and !localTabActive} ? @{${lazyUrl}(country=${selectedCountry})} : null">
                <th:block th:if="${lazyUrl == null or localTabActive}" th:insert="${localPanel}"></th:block>
            </div>
        </div>
    </th:block>
    <!--
      対象はこのフラグメント内のタブだけに限る(ページ全体の .tabs を拾うと、将来1画面に2つ置いたときに干渉するため)。
      左右キーでの移動と tabindex の切り替えは、ARIAのタブパターンに合わせている。
    -->
    <script>
        (function (root) {
            var tabs = Array.prototype.slice.call(root.querySelectorAll('[role="tab"]'));
            function notice(slot, text) {
                var p = document.createElement('p');
                p.className = 'notice';
                p.textContent = text;
                slot.replaceChildren(p);
            }
            // まだ表が入っていないタブを開いたときだけ取りに行く。二度目以降は取得済みの表をそのまま見せる。
            function fill(panel) {
                var slot = panel.querySelector('.ranking-slot[data-lazy-url]');
                if (!slot) {
                    return;
                }
                var url = slot.getAttribute('data-lazy-url');
                slot.removeAttribute('data-lazy-url');
                notice(slot, root.getAttribute('data-loading-text'));
                fetch(url)
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error(response.status);
                        }
                        return response.text();
                    })
                    .then(function (html) {
                        slot.innerHTML = html;
                    })
                    .catch(function () {
                        notice(slot, root.getAttribute('data-error-text'));
                    });
            }
            function select(tab) {
                tabs.forEach(function (other) {
                    var selected = other === tab;
                    other.setAttribute('aria-selected', String(selected));
                    other.setAttribute('tabindex', selected ? '0' : '-1');
                    other.classList.toggle('is-active', selected);
                    var panel = root.querySelector('#' + other.getAttribute('aria-controls'));
                    panel.hidden = !selected;
                    if (selected) {
                        fill(panel);
                    }
                });
            }
            tabs.forEach(function (tab, index) {
                tab.addEventListener('click', function () {
                    select(tab);
                });
                tab.addEventListener('keydown', function (event) {
                    var step = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
                    if (step === 0) {
                        return;
                    }
                    event.preventDefault();
                    var next = tabs[(index + step + tabs.length) % tabs.length];
                    select(next);
                    next.focus();
                });
            });
        })(document.currentScript.parentElement);
    </script>
</div>

</body>
</html>
