<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{error.pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToSearch}"></span></a>

        <!-- errorKey は GlobalExceptionHandler が原因別に設定する。
             存在しないURLや想定外の例外など、Spring Boot 標準のエラー処理でここに来た場合は errorKey が無いため、
             Spring Boot が渡す status で「ページが無い」と「それ以外」を出し分ける。 -->
        <div class="error-box"
             th:text="${errorKey != null} ? #{${errorKey}} : (${status == 404} ? #{error.pageNotFound} : #{error.generic})"></div>
    </main>
</body>
</html>
