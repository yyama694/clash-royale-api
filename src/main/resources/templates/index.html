<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{home.pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <p class="notice lead" th:text="#{app.description}"></p>

        <div class="card">
            <h2 th:text="#{home.player.heading}"></h2>
            <form class="search-form" th:action="@{/player/search}" method="get">
                <label>
                    <span th:text="#{home.player.label}"></span>
                    <input type="text" name="q" required th:placeholder="#{home.player.placeholder}">
                </label>
                <button type="submit" th:text="#{action.search}"></button>
            </form>
        </div>

        <div class="card">
            <h2 th:text="#{home.clan.heading}"></h2>
            <form class="search-form" th:action="@{/clan/search}" method="get">
                <label>
                    <span th:text="#{home.clan.label}"></span>
                    <input type="text" name="q" required th:placeholder="#{home.clan.placeholder}">
                </label>
                <button type="submit" th:text="#{action.search}"></button>
            </form>
        </div>

        <div class="card" id="player-ranking">
            <h2 th:text="#{playerRanking.heading}"></h2>
            <p th:text="#{playerRanking.lead}"></p>
            <!--/* 国を選び直すとページ先頭に戻ってしまうため、送信先にアンカーを付けてランキングの位置に戻す */-->
            <div th:replace="~{fragments/layout :: rankingTabs(
                     ~{fragments/layout :: playerRankingTable(${globalRanking}, false)},
                     ~{fragments/layout :: playerRankingTable(${localRanking}, false)},
                     '/#player-ranking')}"></div>
            <a class="btn btn-secondary" th:href="@{/ranking/players}" th:text="#{playerRanking.link}"></a>
        </div>

        <div class="card">
            <h2 th:text="#{ranking.heading}"></h2>
            <p th:text="#{ranking.lead}"></p>
            <a class="btn btn-secondary" th:href="@{/ranking}" th:text="#{ranking.link}"></a>
        </div>
    </main>
</body>
</html>
