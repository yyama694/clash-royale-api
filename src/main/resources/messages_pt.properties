# Rótulos em português (Brasil).
# As chaves card.* / gamemode.* são os nomes em inglês retornados pela API oficial.
# Chaves ausentes usam o nome em inglês, então não é preciso mudar o código quando sai uma carta nova.
# Pelo formato .properties, os espaços nas chaves são escapados com barra invertida.
# Os termos do jogo (nomes de cartas, cargos, raridade, modos) seguem o texto oficial do jogo e do blog da Supercell.

