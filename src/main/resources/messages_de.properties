about.intro=Princess Tower ist eine inoffizielle Fanseite für Clash Royale-Spieler auf der ganzen Welt. Sie nutzt die offizielle Clash Royale-API von Supercell, um Informationen zu Spielern und Clans, Ranglisten, die Nutzungsraten der Karten und die Decks der besten Spieler anzuzeigen.
about.operator.heading=Wer diese Seite betreibt
about.operator.body=Diese Seite wird von einer Privatperson in Japan als persönliches Projekt betrieben. Sie wird von keinem Unternehmen betrieben und steht in keiner Verbindung zu Supercell.
about.data.heading=Über die Daten
about.data.body=Alle Spieldaten stammen aus der offiziellen API. Spieler- und Claninformationen werden alle paar Minuten aktualisiert, die Decks der besten Spieler und die Nutzungsraten der Karten einmal täglich gesammelt. Wenn dir etwas falsch vorkommt, gib uns bitte Bescheid.
