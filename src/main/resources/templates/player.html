<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToTop}"></span></a>
        <form th:replace="~{fragments/layout :: playerSearchBar}"></form>

        <div class="card">
            <div class="page-heading">
                <h1><bdi th:text="${playerName}"></bdi></h1>
                <span th:replace="~{fragments/layout :: favoriteButton('players', ${playerPathTag}, ${favorite}, ${favoriteLimit}, ${favoriteHint})}"></span>
            </div>
            <!--/* 所属クランは名前の次に気になる情報で、クラン情報画面への入口にもなるので、タグと並べて見出しのすぐ下に置く */-->
            <p class="profile-meta">
                <span class="tag-pill" th:text="${player.tag()}"></span>
                <a class="profile-clan" th:if="${player.clan()}" th:href="@{/clan/{tag}(tag=${clanPathTag})}">
                    <span aria-hidden="true">🛡️</span>
                    <span class="visually-hidden" th:text="#{player.clan}"></span>
                    <bdi th:text="${clanName}"></bdi>
                </a>
            </p>
            <!--/*
              「これは自分」。登録するとトップページの一番上に、この人の今の成績と前回見たときからの変化が出る。
              ☆(お気に入り)は本人以外の登録が無かったので、自分のページを探しに来た人に向けた、動機の分かりやすいボタンを別に置く。
            */-->
            <form class="me-form" method="post"
                  th:action="${isMe} ? @{/me/{tag}/remove(tag=${playerPathTag},lang=${#locale.language})} : @{/me/{tag}(tag=${playerPathTag},lang=${#locale.language})}">
                <span th:if="${isMe}" class="me-badge" th:text="#{me.current}"></span>
                <button type="submit" class="btn btn-secondary btn-small" th:text="${isMe} ? #{me.remove} : #{me.set}"></button>
                <span th:unless="${isMe}" class="me-hint" th:text="#{me.hint}"></span>
            </form>
            <div th:replace="~{fragments/layout :: shareButtons(${shareText}, '/player/' + ${playerPathTag})}"></div>
            <!--/*
              強さが一目で分かる項目(トロフィー・ランク戦の順位・連勝連敗)は大きく出し、残りは小さく並べる。
              絵文字は見た目の目印なので、読み上げでは項目名だけが読まれるよう aria-hidden にする。
              ランク戦の成績は、上位の順位に入ったプレイヤーにしか意味のある値が無い(それ以外は順位なし・レーティング0)。
            */-->
            <ul class="stat-highlights">
                <li><span class="label"><span aria-hidden="true">🏆</span> <span th:text="#{player.trophies}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.trophies(), 1, 'DEFAULT')}"></span></li>
                <th:block th:with="r=${player.currentPathOfLegendSeasonResult()}"><li th:if="${r != null and r.hasRank()}"><span class="label"><span aria-hidden="true">🏅</span> <span th:text="#{player.ranked.current}"></span></span><span class="value" th:text="#{player.ranked.rank(${r.rank()})}"></span><span class="sub" th:text="#{player.ranked.rating(${r.trophies()})}"></span></li></th:block>
                <li th:if="${rankedLeague}"><span class="label"><span aria-hidden="true">🏅</span> <span th:text="#{player.ranked.current}"></span></span><span class="value" th:text="${rankedLeague.name()}"></span><span class="sub" th:if="${rankedLeague.rating() != null}" th:text="#{player.ranked.rating(${rankedLeague.rating()})}"></span></li>
                <li th:if="${streak}"><span class="label"><span aria-hidden="true">🔥</span> <span th:text="#{player.streak}"></span></span><span class="value" th:text="${streak}"></span></li>
            </ul>
            <ul class="stat-grid stat-grid-compact">
                <li><span class="label"><span aria-hidden="true">⭐</span> <span th:text="#{player.kingTowerLevel}"></span></span><span class="value" th:text="${kingTowerLevel} ?: '-'"></span></li>
                <li><span class="label"><span aria-hidden="true">🥇</span> <span th:text="#{player.bestTrophies}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.bestTrophies(), 1, 'DEFAULT')}"></span></li>
                <li><span class="label"><span aria-hidden="true">⚔️</span> <span th:text="#{player.wins}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.wins(), 1, 'DEFAULT')}"></span></li>
                <li><span class="label"><span aria-hidden="true">❌</span> <span th:text="#{player.losses}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.losses(), 1, 'DEFAULT')}"></span></li>
                <li><span class="label"><span aria-hidden="true">👑</span> <span th:text="#{player.threeCrownWins}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.threeCrownWins(), 1, 'DEFAULT')}"></span></li>
                <th:block th:with="r=${player.bestPathOfLegendSeasonResult()}"><li th:if="${r != null and r.hasRank()}"><span class="label"><span aria-hidden="true">🏅</span> <span th:text="#{player.ranked.best}"></span></span><span class="value" th:text="#{player.ranked.rank(${r.rank()})}"></span><span class="sub" th:text="#{player.ranked.rating(${r.trophies()})}"></span></li></th:block>
            </ul>
            <!--/* 前回この画面を見たときからの変化。前回の値はブラウザにあるので、末尾のスクリプトで差を出し、変化した項目だけを見せる。 */-->
            <div th:replace="~{fragments/layout :: sinceLast(${playerPathTag}, ${progress})}"></div>
            <div class="card-notes" th:if="${streak}">
                <p th:replace="~{fragments/layout :: notice(#{player.streak.notice})}"></p>
            </div>
        </div>

        <!--/*
          今シーズンの順位の推移(世界上位1000人に入ったことのある人だけ)。15分ごとの記録を1時間ごとに間引いたもの。
          線はSVGを描画域いっぱいに引き伸ばし(線の太さは vector-effect で保つ)、目盛り・最新の点・ホバーの読み取りはHTMLで重ねる。
          SVGごと縮めると、スマホ幅で目盛りの文字が読めないほど小さくなるため。位置は描画域に対する割合(--pos・--x・--y、単位なしの%)。
        */-->
        <div class="card rank-history" th:if="${rankHistory}" th:with="h=${rankHistory}">
            <h2 th:text="#{rankHistory.heading}"></h2>
            <p class="rank-history-best" th:text="${h.best()}"></p>
            <div class="rank-chart" th:attr="data-points=${h.pointsJson()},data-point-label=${h.pointLabel()},data-rank-top=${h.rankTop()},data-rank-bottom=${h.rankBottom()}">
                <div class="rank-chart-y" aria-hidden="true">
                    <span th:each="t : ${h.yTicks()}" th:style="|--pos:${t.position()}|" th:text="${t.label()}"></span>
                </div>
                <div class="rank-chart-plot" role="img" tabindex="0" th:aria-label="${h.best()}">
                    <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
                        <line th:each="t : ${h.yTicks()}" class="rank-chart-grid" x1="0" x2="1000"
                              th:y1="${t.svgPosition()}" th:y2="${t.svgPosition()}"></line>
                        <polyline th:each="s : ${h.segments()}" class="rank-chart-line" th:points="${s}"></polyline>
                    </svg>
                    <span class="rank-chart-dot" th:style="|--x:${h.endX()};--y:${h.endY()}|"></span>
                    <span class="rank-chart-end" th:classappend="${h.endBelow()} ? 'below'" th:style="|--y:${h.endY()}|"
                          th:text="${h.endLabel()}"></span>
                    <span class="rank-chart-crosshair" hidden></span>
                    <span class="rank-chart-dot rank-chart-hover" hidden></span>
                    <div class="rank-chart-tip" hidden aria-live="polite"></div>
                </div>
                <div class="rank-chart-x" aria-hidden="true">
                    <span th:each="t : ${h.xTicks()}" th:style="|--pos:${t.position()}|" th:text="${t.label()}"></span>
                </div>
            </div>
            <div class="card-notes">
                <p th:replace="~{fragments/layout :: notice(#{rankHistory.notice})}"></p>
            </div>
        </div>

        <div class="card current-deck">
            <h2 th:text="#{deck.heading}"></h2>
            <th:block th:if="${currentDeck}">
                <div th:replace="~{fragments/layout :: deckGrid(${currentDeck.cards()})}"></div>
                <th:block th:if="${not #lists.isEmpty(currentDeck.supportCards())}">
                    <div th:replace="~{fragments/layout :: supportCardRow(#{battle.supportCards}, ${currentDeck.supportCards()})}"></div>
                </th:block>
                <div th:replace="~{fragments/layout :: deckMeta(${currentDeck.meta()})}"></div>
                <!--/* 同じデッキを使う世界ランカーの人数と、デッキ画面の絞り込みへのリンク。検索から着地した人が次に見るページの入口にする。 */-->
                <p class="similar-decks" th:if="${similarDecks}">
                    <span aria-hidden="true">🏅</span>
                    <span th:text="${similarDecks.text()}"></span>
                    <span class="similar-decks-note" th:if="${similarDecks.selfExcluded()}" th:text="#{deck.similar.selfExcluded}"></span>
                    <a th:href="@{/decks(card=${similarDecks.cardIds()},lang=${#locale.language})}" th:text="#{deck.similar.link}"></a>
                </p>
                <div class="card-notes" th:if="${currentDeck.completedFromBattle()}">
                    <p th:replace="~{fragments/layout :: notice(#{deck.completed})}"></p>
                </div>
            </th:block>
            <p th:unless="${currentDeck}" class="empty-state" th:text="#{deck.empty}"></p>
        </div>

        <div th:if="${battleStats}" class="card">
            <h2 th:text="#{stats.heading}"></h2>
            <th:block th:if="${battleStats.total() > 0}">
                <p class="stats-summary">
                    <span th:text="#{stats.summary(${battleStats.total()}, ${battleStats.wins()}, ${battleStats.losses()})}"></span>
                    <span th:if="${battleStats.draws() > 0}" th:text="#{stats.draws(${battleStats.draws()})}"></span>
                    <span class="stats-rate" th:text="#{stats.winRate(${battleStats.winRatePercent()})}"></span>
                </p>

                <div th:if="${battleStats.cardRanking()}">
                    <h3 th:text="#{stats.favorite.heading}"></h3>
                    <th:block th:unless="${#lists.isEmpty(battleStats.favoriteCards())}">
                        <div th:replace="~{fragments/layout :: performanceGrid(${battleStats.favoriteCards()}, 'good')}"></div>
                    </th:block>
                    <p th:if="${#lists.isEmpty(battleStats.favoriteCards())}" class="empty-state" th:text="#{stats.favorite.none}"></p>

                    <h3 th:text="#{stats.weak.heading}"></h3>
                    <th:block th:unless="${#lists.isEmpty(battleStats.weakCards())}">
                        <div th:replace="~{fragments/layout :: performanceGrid(${battleStats.weakCards()}, 'bad')}"></div>
                    </th:block>
                    <p th:if="${#lists.isEmpty(battleStats.weakCards())}" class="empty-state" th:text="#{stats.weak.none}"></p>
                </div>
                <p th:unless="${battleStats.cardRanking()}" class="empty-state" th:text="#{stats.insufficient}"></p>
            </th:block>
            <p th:if="${battleStats.total() == 0}" class="empty-state" th:text="#{stats.nothingCounted}"></p>
            <!--/* 集計の前提の説明は、結果を読んでから確かめられるよう末尾にまとめる */-->
            <div class="card-notes">
                <p th:replace="~{fragments/layout :: notice(#{stats.notice})}"></p>
                <th:block th:if="${battleStats.friendlyExcluded() > 0}">
                    <p th:replace="~{fragments/layout :: notice(#{stats.friendlyExcluded(${battleStats.friendlyExcluded()})})}"></p>
                </th:block>
                <th:block th:if="${battleStats.boatDefenseExcluded() > 0}">
                    <p th:replace="~{fragments/layout :: notice(#{stats.boatDefenseExcluded(${battleStats.boatDefenseExcluded()})})}"></p>
                </th:block>
                <th:block th:if="${battleStats.total() > 0 and battleStats.cardRanking()}">
                    <p th:replace="~{fragments/layout :: notice(#{stats.method})}"></p>
                </th:block>
            </div>
        </div>

        <div class="card">
            <h2 th:text="#{battlelog.heading}"></h2>
            <p th:if="${battleLogErrorKey}" class="error-box" th:text="#{${battleLogErrorKey}}"></p>
            <p th:if="${battles != null and #lists.isEmpty(battles)}" class="empty-state" th:text="#{battlelog.empty}"></p>
            <!--/*
              1戦を2行(対戦相手 / モード・日時)にまとめ、勝敗とクラウンは左端に縦に積む。表にするとスマホで1戦が6行になり、30戦で画面が非常に長くなっていた。
              勝敗は左端の色帯でも示し、連勝・連敗の流れを縦に見渡せるようにする。
            */-->
            <ol class="battle-list" th:if="${battles != null and not #lists.isEmpty(battles)}">
                <li class="battle-item" th:each="b : ${battles}" th:classappend="'battle-' + ${b.result().code()}">
                    <div class="battle-result">
                        <span th:replace="~{fragments/layout :: resultBadge(${b.result()})}"></span>
                        <span class="battle-crowns">
                            <span class="visually-hidden" th:text="#{battlelog.col.crowns}"></span>
                            <span th:text="${b.selfCrowns()} + ' - ' + ${b.opponentCrowns()}"></span>
                        </span>
                    </div>
                    <div class="battle-body">
                        <!--/* 2v2では相手が2人いて味方もいるため、全員を出す(相手の1人目だけだと対戦の半分しか分からない) */-->
                        <div class="battle-opponents">
                            <span class="visually-hidden" th:text="#{battlelog.col.opponent}"></span>
                            <span class="name-list">
                                <span th:each="o : ${b.opponents()}"><a th:href="@{/player/{tag}(tag=${o.pathTag()})}"><bdi th:text="${o.name()}"></bdi></a>
                                    <span th:if="${o.averageLevel() != null}" class="opponent-level"
                                          th:text="#{battlelog.averageLevel(${#numbers.formatDecimal(o.averageLevel(), 1, 1)})}"></span></span>
                            </span>
                        </div>
                        <div class="battle-sub">
                            <span th:text="${b.gameMode()}"></span>
                            <time th:replace="~{fragments/layout :: localTime(${b.time()})}"></time>
                            <th:block th:if="${b.trophyChange()}"><span th:replace="~{fragments/layout :: trophyChange(${b.trophyChange()})}"></span></th:block>
                            <span th:unless="${#lists.isEmpty(b.teammates())}" class="teammates">
                                <span th:text="#{battlelog.teammate}"></span>
                                <span class="name-list">
                                    <a th:each="t : ${b.teammates()}" th:href="@{/player/{tag}(tag=${t.pathTag()})}"><bdi th:text="${t.name()}"></bdi></a>
                                </span>
                            </span>
                        </div>
                        <!--/*
                          自分と相手のデッキ。1戦ずつ「詳細」を開かなくても、どのデッキで何と当たって勝った・負けたかが分かるように、
                          小さな絵だけを2段に並べる(全試合に出すのは2026-10-12にユーザーが決定)。カード名は代替テキストとマウスを重ねたときに出す。
                          2v2の相手は2人分を並べる。
                        */-->
                        <div class="battle-decks">
                            <th:block th:unless="${#lists.isEmpty(b.selfCards())}">
                                <span class="battle-deck-label" th:text="#{battlelog.deck.self}"></span>
                                <span class="battle-deck-group"><span th:replace="~{fragments/layout :: miniDeck(${b.selfCards()})}"></span></span>
                            </th:block>
                            <span class="battle-deck-label" th:text="#{battlelog.deck.opponent}"></span>
                            <span class="battle-deck-group"><th:block th:each="o : ${b.opponents()}"><th:block
                                  th:unless="${#lists.isEmpty(o.cards())}"><span th:replace="~{fragments/layout :: miniDeck(${o.cards()})}"></span></th:block></th:block></span>
                        </div>
                    </div>
                    <a class="btn btn-secondary btn-small battle-detail" th:href="@{/player/{tag}/battles/{time}(tag=${playerPathTag},time=${b.battleTime()})}"><span class="battle-detail-label" th:text="#{action.detail}"></span></a>
                </li>
            </ol>
            <div class="card-notes">
                <p th:replace="~{fragments/layout :: notice(#{battlelog.notice})}"></p>
            </div>
        </div>

        <!--/*
          育成途中のプレイヤーには「最大レベル 0/29枚(0%)」が並ぶだけになりやすいので、デッキ・戦績・対戦履歴の後ろに置く。
        */-->
        <div th:if="${cardCollection}" class="card">
            <h2 th:text="#{cardCollection.heading}"></h2>
            <p th:replace="~{fragments/layout :: notice(#{cardCollection.notice(${cardCollection.maxedPercent()})})}"></p>
            <!--/* 割合は文言で読めるので、バーは見た目の補助として読み上げから外す */-->
            <ul class="collection-list">
                <li th:each="r : ${cardCollection.rarities()}">
                    <div class="collection-head">
                        <span class="collection-rarity" th:text="${r.rarityLabel()}"></span>
                        <span class="collection-count" th:text="#{cardCollection.rarity.value(${r.maxedCards()}, ${r.totalCards()}, ${r.maxedPercent()})}"></span>
                    </div>
                    <div class="progress" aria-hidden="true"><span th:style="'--percent: ' + ${r.maxedPercent()} + '%'"></span></div>
                </li>
            </ul>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script th:replace="~{fragments/layout :: sinceLastScript}"></script>
    <!--/* 「これは自分」の人はトップページの「自分の成績」に出るので、「最近見たもの」には残さない(10人の枠を使わないため) */-->
    <th:block th:unless="${isMe}">
        <script th:replace="~{fragments/layout :: recentViewsScript('player', ${playerPathTag}, ${playerName})}"></script>
    </th:block>
    <!--/*
      順位の推移のホバー。縦線は指した時刻に一番近い記録に吸い付き、日時(UTC)と順位・レーティングを出す。
      キーボードでは、グラフにフォーカスして左右の矢印キーで1時間ずつ動かす。
    */-->
    <script th:if="${rankHistory}">
        (function () {
            document.querySelectorAll('.rank-chart').forEach(function (chart) {
                var points = JSON.parse(chart.dataset.points);
                var top = Number(chart.dataset.rankTop);
                var bottom = Number(chart.dataset.rankBottom);
                var from = points[0][0];
                var to = points[points.length - 1][0];
                var plot = chart.querySelector('.rank-chart-plot');
                var crosshair = chart.querySelector('.rank-chart-crosshair');
                var dot = chart.querySelector('.rank-chart-hover');
                var tip = chart.querySelector('.rank-chart-tip');
                var lang = document.documentElement.lang;
                var number = new Intl.NumberFormat(lang);
                var time = new Intl.DateTimeFormat(lang, {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
                    timeZone: 'UTC', timeZoneName: 'short'
                });
                var index = points.length - 1;

                function show(i) {
                    index = Math.min(Math.max(i, 0), points.length - 1);
                    var p = points[index];
                    var x = (p[0] - from) / (to - from) * 100;
                    var y = (p[1] - top) / (bottom - top) * 100;
                    crosshair.style.setProperty('--x', x);
                    dot.style.setProperty('--x', x);
                    dot.style.setProperty('--y', y);
                    var value = document.createElement('strong');
                    value.textContent = chart.dataset.pointLabel
                        .replace('{rank}', number.format(p[1]))
                        .replace('{rating}', number.format(p[2]));
                    tip.textContent = '';
                    tip.append(value, document.createElement('br'), time.format(new Date(p[0] * 1000)));
                    crosshair.hidden = dot.hidden = tip.hidden = false;
                    var width = plot.clientWidth;
                    var left = x / 100 * width - tip.offsetWidth / 2;
                    tip.style.left = Math.min(Math.max(left, 0), width - tip.offsetWidth) + 'px';
                }

                function hide() {
                    crosshair.hidden = dot.hidden = tip.hidden = true;
                }

                function nearest(clientX) {
                    var rect = plot.getBoundingClientRect();
                    var t = from + (clientX - rect.left) / rect.width * (to - from);
                    var best = 0;
                    for (var i = 1; i < points.length; i++) {
                        if (Math.abs(points[i][0] - t) < Math.abs(points[best][0] - t)) {
                            best = i;
                        }
                    }
                    return best;
                }

                plot.addEventListener('pointermove', function (e) { show(nearest(e.clientX)); });
                plot.addEventListener('pointerdown', function (e) { show(nearest(e.clientX)); });
                plot.addEventListener('pointerleave', hide);
                plot.addEventListener('focus', function () { show(index); });
                plot.addEventListener('blur', hide);
                plot.addEventListener('keydown', function (e) {
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        show(index + (e.key === 'ArrowLeft' ? -1 : 1));
                    }
                });
            });
        })();
    </script>
</body>
</html>
