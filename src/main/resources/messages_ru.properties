# Русские подписи.
# Ключи card.* / gamemode.* соответствуют английским названиям, которые возвращает официальный API.
# Для отсутствующих ключей используется английское название, поэтому появление новой карты не требует правок кода.
# В формате .properties пробелы в ключах экранируются обратной косой чертой.
# Игровые термины (названия карт, роли, редкость, режимы) соответствуют официальному тексту игры и блогу Supercell.
# Русский язык требует четырёх форм множественного числа (one/few/many/other, ICU MessageFormat).

