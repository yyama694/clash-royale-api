spring:
  application:
    name: clash-royale-api
  # メッセージリソースの設定(basename等)は MessageSourceConfig にある。ICUの書式を使うため自前で定義している。
  cache:
    cache-names: players,clans,battleLogs,clanSearches,clanRankings,playerRankings,locations,cards
    caffeine:
      spec: maximumSize=500,expireAfterWrite=2m
  http:
    client:
      connect-timeout: 3s
      read-timeout: 8s
  web:
    resources:
      # CSS/JSのURLに中身のハッシュを付ける(例: /css/style-1a2b3c.css)。Thymeleafの @{...} 経由のリンクに自動で反映される。
      # 既定ではCache-ControlもETagも返さないため、ブラウザが古いCSSを使い続け、デプロイしても表示が変わらないことがあった。
      chain:
        strategy:
          content:
            enabled: true
      # URLが中身ごとに変わるので、同じURLのファイルは長期間キャッシュしてよい。
      cache:
        cachecontrol:
          max-age: 365d

server:
  port: 8080
  # 個人ランキング画面は1000人×2タブでHTMLが約1.6MBになり、転送だけで本番で3〜6秒かかっていた
  # (サーバー側の描画は0.04秒で、遅さの原因はほぼ転送量)。既定では圧縮が無効なため明示的に有効にする。
  compression:
    enabled: true

# 名前検索のために、公式APIの応答で見かけたプレイヤーのタグと名前を蓄積する場所(「プレイヤー名検索（検討中）.md」参照)。
# 本番は環境変数 PLAYER_INDEX_DIR で /var/lib/clash-royale-api/player-index を指定する。
player-index:
  dir: ${PLAYER_INDEX_DIR:data/player-index}
  # inbox を by-tag にまとめる時刻(UTC)。18:30 UTC = 日本時間 3:30。"-" にすると動かさない。
  compact-cron: ${PLAYER_INDEX_COMPACT_CRON:0 30 18 * * *}

# 名前検索用にクラン対戦の履歴とプレイヤーの対戦履歴を巡回してプレイヤーを集める(Crawler)。既定では動かさない。
# 本番では /etc/clash-royale-api/env の環境変数で有効化・間隔を変える(ビルドし直さずに止められるように)。
crawler:
  enabled: ${CRAWLER_ENABLED:false}
  interval: ${CRAWLER_INTERVAL:2s}
  # 1だと、対戦相手として見つけたクランの直近の対戦が既に取得済みの対戦と同じになり、新規が0人になる(実測)。
  races-per-clan: ${CRAWLER_RACES_PER_CLAN:10}
  # 5回に1回をプレイヤーの対戦履歴の巡回にする(クランに入っていない人を拾うため)。
  battle-log-every: ${CRAWLER_BATTLE_LOG_EVERY:5}

clashroyale:
  api:
    base-url: https://api.clashroyale.com/v1
    # token はリポジトリにもjarにも置かない。
    #   ローカル: ./config/application-local.yml (gitignore対象、jarには含まれない)
    #   本番   : 環境変数 CLASHROYALE_API_TOKEN (systemdのEnvironmentFile経由)
    # 未設定のまま起動すると ClashRoyaleApiProperties の @NotBlank で即座に失敗する。
