<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{cards.pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToTop}"></span></a>

        <div class="card">
            <h1 th:text="#{cards.pageTitle}"></h1>
            <p th:text="#{cards.lead}"></p>
            <!--/* 絞り込みはブラウザ内で行う(全カードを一度に出しているので、サーバーへ問い合わせ直す必要が無い)。スクリプトが動かなければ全件表示のまま。 */-->
            <form class="search-form card-filter" role="search" onsubmit="return false;">
                <label>
                    <span th:text="#{cards.filter.label}"></span>
                    <input type="search" id="card-filter" autocomplete="off" th:placeholder="#{cards.filter.placeholder}">
                </label>
                <!--/* 押した数字だけを残す(複数選べる)。何も押していない状態は「すべて」。 */-->
                <fieldset class="elixir-filter" id="elixir-filter">
                    <legend th:text="#{cards.filter.elixir}"></legend>
                    <button type="button" class="elixir-chip" aria-pressed="false"
                            th:each="cost : ${elixirCosts}" th:value="${cost}" th:text="${cost}"
                            th:aria-label="#{cards.elixir(${cost})}"></button>
                </fieldset>
            </form>
            <p class="empty-state" id="card-filter-empty" hidden th:text="#{cards.filter.empty}"></p>
        </div>

        <section class="card card-group" th:each="group : ${groups}">
            <h2 th:text="${group.heading()}"></h2>
            <div class="deck-grid card-catalog">
                <div class="deck-card" th:each="c : ${group.cards()}"
                     th:attr="data-search=${c.name() + ' ' + c.englishName()},data-elixir=${c.elixirCost()}">
                    <div class="card-thumb">
                        <a th:replace="~{fragments/layout :: cardLink(${c.id()}, ${c.name()}, ${c.iconUrl()})}"></a>
                        <span th:replace="~{fragments/layout :: elixirBadge(${c.elixir()})}"></span>
                    </div>
                    <div class="card-name" th:text="${c.name()}"></div>
                </div>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!--/*
      日本語名はひらがなで打っても当たるよう、カタカナに寄せてから比べる(「ないと」→「ナイト」)。
      全角・半角の揺れはNFKCで、英字の大小は小文字化で吸収する。
      スペイン語・ポルトガル語名はアクセント記号を省いて打っても当たるようにする(「valquiria」→「Valquíria」)。
      外すのはラテン文字用の結合記号(U+0300〜U+036F)だけなので、濁点(U+3099)は残る。
    */-->
    <script>
        (function () {
            var input = document.getElementById('card-filter');
            var empty = document.getElementById('card-filter-empty');
            var chips = Array.prototype.slice.call(document.querySelectorAll('#elixir-filter .elixir-chip'));
            var cards = Array.prototype.slice.call(document.querySelectorAll('.card-catalog .deck-card'));
            var groups = Array.prototype.slice.call(document.querySelectorAll('.card-group'));
            function normalize(text) {
                return text.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').normalize('NFKC')
                        .toLowerCase().replace(/[ぁ-ゖ]/g, function (ch) {
                    return String.fromCharCode(ch.charCodeAt(0) + 0x60);
                }).replace(/[\s・.\-]/g, '');
            }
            cards.forEach(function (card) {
                card.dataset.normalized = normalize(card.dataset.search || '');
            });
            function apply() {
                var query = normalize(input.value);
                // 数字を1つも押していないときは、エリクサーでは絞らない(鏡・タワーユニットも残す)。
                var costs = chips.filter(function (chip) {
                    return chip.getAttribute('aria-pressed') === 'true';
                }).map(function (chip) {
                    return chip.value;
                });
                cards.forEach(function (card) {
                    var byName = query === '' || card.dataset.normalized.indexOf(query) >= 0;
                    var byCost = costs.length === 0 || costs.indexOf(card.dataset.elixir) >= 0;
                    card.hidden = !(byName && byCost);
                });
                var anyVisible = false;
                groups.forEach(function (group) {
                    var visible = group.querySelector('.deck-card:not([hidden])') !== null;
                    group.hidden = !visible;
                    anyVisible = anyVisible || visible;
                });
                empty.hidden = anyVisible;
            }
            input.addEventListener('input', apply);
            chips.forEach(function (chip) {
                chip.addEventListener('click', function () {
                    chip.setAttribute('aria-pressed', chip.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
                    apply();
                });
            });
        })();
    </script>
</body>
</html>
