about.intro=Princess Tower es un sitio no oficial creado por fans para jugadores de Clash Royale de todo el mundo. Usa la API oficial de Clash Royale que ofrece Supercell para mostrar información de jugadores y clanes, clasificaciones, el uso de las cartas y los mazos de los mejores jugadores.
about.operator.heading=Quién gestiona este sitio
about.operator.body=Este sitio lo gestiona un particular en Japón como proyecto personal. No lo gestiona ninguna empresa y no tiene ninguna relación con Supercell.
about.data.heading=Sobre los datos
about.data.body=Todos los datos del juego provienen de la API oficial. La información de jugadores y clanes se actualiza cada pocos minutos, y los mazos de los mejores jugadores y el uso de las cartas se recopilan una vez al día. Si algo te parece incorrecto, avísanos.
