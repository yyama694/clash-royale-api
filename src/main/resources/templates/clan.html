<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>クラン情報</title>
</head>
<body>
    <p><a th:href="@{/}">&laquo; 検索に戻る</a></p>

    <div th:if="${error}">
        <p th:text="${error}" style="color:red;"></p>
    </div>

    <div th:if="${clan}">
        <h1 th:text="${clan.name()}"></h1>
        <p>タグ: <span th:text="${clan.tag()}"></span></p>
        <p th:text="${clan.description()}"></p>
        <ul>
            <li>クランスコア: <span th:text="${clan.clanScore()}"></span></li>
            <li>メンバー数: <span th:text="${clan.members()}"></span></li>
        </ul>

        <h2>メンバー一覧</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>名前</th>
                    <th>役職</th>
                    <th>レベル</th>
                    <th>トロフィー</th>
                    <th>寄付数</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member : ${clan.memberList()}">
                    <td th:text="${member.name()}"></td>
                    <td th:text="${member.role()}"></td>
                    <td th:text="${member.expLevel()}"></td>
                    <td th:text="${member.trophies()}"></td>
                    <td th:text="${member.donations()}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
