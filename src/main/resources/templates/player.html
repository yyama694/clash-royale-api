<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${player.name()})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToSearch}"></span></a>

        <div class="card">
            <h1 th:text="${player.name()}"></h1>
            <p><span class="tag-pill" th:text="${player.tag()}"></span></p>
            <ul class="stat-grid">
                <li><span class="label">⭐ <span th:text="#{player.expLevel}"></span></span><span class="value" th:text="${player.expLevel()}"></span></li>
                <li><span class="label">🏆 <span th:text="#{player.trophies}"></span></span><span class="value" th:text="${player.trophies()}"></span></li>
                <li><span class="label">🥇 <span th:text="#{player.bestTrophies}"></span></span><span class="value" th:text="${player.bestTrophies()}"></span></li>
                <li><span class="label">✅ <span th:text="#{player.wins}"></span></span><span class="value" th:text="${player.wins()}"></span></li>
                <li><span class="label">❌ <span th:text="#{player.losses}"></span></span><span class="value" th:text="${player.losses()}"></span></li>
                <li><span class="label">👑 <span th:text="#{player.threeCrownWins}"></span></span><span class="value" th:text="${player.threeCrownWins()}"></span></li>
                <li th:if="${player.clan()}"><span class="label">🛡️ <span th:text="#{player.clan}"></span></span><span class="value"><a th:href="@{/clan/{tag}(tag=${clanPathTag})}" th:text="${player.clan().name()}"></a></span></li>
            </ul>
        </div>

        <div th:if="${battleStats}" class="card">
            <h2 th:text="#{stats.heading}"></h2>
            <p class="notice" th:text="'※' + #{stats.notice}"></p>
            <p>
                <span th:text="#{stats.summary(${battleStats.total()}, ${battleStats.wins()}, ${battleStats.losses()})}"></span>
                <span th:if="${battleStats.draws() > 0}" th:text="#{stats.draws(${battleStats.draws()})}"></span>
            </p>

            <div th:if="${battleStats.hasCardRanking()}">
                <p class="notice" th:text="'※' + #{stats.method}"></p>

                <h3 th:text="#{stats.favorite.heading}"></h3>
                <div class="deck-grid">
                    <div class="deck-card" th:each="c : ${battleStats.favoriteCards()}">
                        <img th:if="${c.iconUrl() != null}" th:src="${c.iconUrl()}" th:alt="${c.name()}" loading="lazy">
                        <div class="card-name" th:text="${c.name()}"></div>
                        <div class="card-level" th:text="#{stats.record(${c.winRatePercent()}, ${c.wins()}, ${c.uses()})}"></div>
                    </div>
                </div>

                <h3 th:text="#{stats.weak.heading}"></h3>
                <div class="deck-grid">
                    <div class="deck-card" th:each="c : ${battleStats.weakCards()}">
                        <img th:if="${c.iconUrl() != null}" th:src="${c.iconUrl()}" th:alt="${c.name()}" loading="lazy">
                        <div class="card-name" th:text="${c.name()}"></div>
                        <div class="card-level" th:text="#{stats.record(${c.winRatePercent()}, ${c.wins()}, ${c.uses()})}"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 th:text="#{battlelog.heading}"></h2>
            <p class="notice" th:text="'※' + #{battlelog.notice}"></p>
            <p th:if="${battleLogErrorKey}" class="error-box" th:text="#{${battleLogErrorKey}}"></p>
            <p th:if="${battles != null and #lists.isEmpty(battles)}" class="empty-state" th:text="#{battlelog.empty}"></p>
            <div th:if="${battles != null and not #lists.isEmpty(battles)}" class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th th:text="#{battlelog.col.time}"></th>
                            <th th:text="#{battlelog.col.mode}"></th>
                            <th th:text="#{battlelog.col.result}"></th>
                            <th th:text="#{battlelog.col.crowns}"></th>
                            <th th:text="#{battlelog.col.opponent}"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${battles}">
                            <td><a th:href="@{/player/{tag}/battles/{time}(tag=${playerPathTag},time=${b.battleTime()})}" th:text="${b.battleTime()}"></a></td>
                            <td th:text="${b.gameMode()}"></td>
                            <td><span th:replace="~{fragments/layout :: resultBadge(${b.result()})}"></span></td>
                            <td th:text="${b.selfCrowns()} + ' / ' + ${b.opponentCrowns()}"></td>
                            <td><a th:href="@{/player/{tag}(tag=${b.opponentPathTag()})}" th:text="${b.opponentName()}"></a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
