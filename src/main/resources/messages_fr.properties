# Libellés en français.
# Les clés card.* / gamemode.* correspondent aux noms anglais renvoyés par l'API officielle.
# Les clés manquantes utilisent le nom anglais, donc l'apparition d'une nouvelle carte ne nécessite pas de modifier le code.
# Selon le format .properties, les espaces dans les clés sont échappés avec une barre oblique inversée.
# Les termes du jeu (noms de cartes, rôles, qualité, modes) suivent le texte officiel du jeu et le blog de Supercell.

