<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <!--/* 直接開かれたとき(戻る履歴が無いとき)の戻り先は、トップページよりカード一覧の方が自然 */-->
        <a class="back-link" th:href="@{/cards}">&laquo; <span th:text="#{action.backToCards}"></span></a>

        <div class="card">
            <h1><bdi th:text="${card.name()}"></bdi></h1>
            <!--/* 英語以外のUIでは英語名も併記する。英語UIでは同じ文字列になるので出さない。 */-->
            <p class="card-english-name" th:if="${card.englishName() != card.name()}"
               lang="en" th:text="${card.englishName()}"></p>

            <div class="card-detail">
                <!--/* 進化(限界突破)・ヒーローがあるカードは複数並ぶため、どれがどれか分かるよう通常側にもラベルを付ける */-->
                <div class="card-artwork">
                    <figure th:if="${card.iconUrl() != null}">
                        <img th:src="${card.iconUrl()}" alt="" width="285" height="420">
                        <figcaption th:if="${card.hasOtherForms()}" th:text="#{card.normal}"></figcaption>
                    </figure>
                    <figure th:if="${card.evolutionIconUrl() != null}">
                        <img th:src="${card.evolutionIconUrl()}" alt="" width="285" height="420">
                        <figcaption th:text="#{card.evolution}"></figcaption>
                    </figure>
                    <figure th:if="${card.heroIconUrl() != null}">
                        <img th:src="${card.heroIconUrl()}" alt="" width="285" height="420">
                        <figcaption th:text="#{card.hero}"></figcaption>
                    </figure>
                </div>

                <ul class="stat-grid">
                    <li><span class="label" th:text="#{card.rarity}"></span><span class="value" th:text="${card.rarity()}"></span></li>
                    <li th:if="${card.elixirCost() != null}"><span class="label" th:text="#{card.elixirCost}"></span><span class="value" th:text="${card.elixirCost()}"></span></li>
                    <li><span class="label" th:text="#{card.levelRange}"></span><span class="value" th:text="#{card.levelRange.value(${card.minLevel()}, ${card.maxLevel()})}"></span></li>
                </ul>
            </div>

            <p th:replace="~{fragments/layout :: notice(#{card.notice})}"></p>
        </div>

        <div th:if="${usage}" class="card">
            <h2 th:text="#{cardUsage.heading}"></h2>
            <ul class="stat-grid">
                <li><span class="label" th:text="#{cardUsage.rate}"></span><span class="value" th:text="#{cardUsage.rate.value(${usage.percent()})}"></span></li>
                <li><span class="label" th:text="#{cardUsage.users}"></span><span class="value" th:text="#{cardUsage.users.value(${usage.users()}, ${usage.sampleSize()})}"></span></li>
                <li th:if="${usage.rank() != null}"><span class="label" th:text="#{cardUsage.rank}"></span><span class="value" th:text="#{cardUsage.rank.value(${usage.rank()}, ${usage.rankedOf()})}"></span></li>
            </ul>

            <th:block th:unless="${#lists.isEmpty(usage.partners())}">
                <h3 th:text="#{cardUsage.partners.heading}"></h3>
                <div class="deck-grid">
                    <div class="deck-card" th:each="p : ${usage.partners()}">
                        <a th:replace="~{fragments/layout :: cardLink(${p.id()}, ${p.name()}, ${p.iconUrl()})}"></a>
                        <div class="card-name" th:text="${p.name()}"></div>
                        <div class="card-sub" th:text="#{cardUsage.partner.value(${p.percent()})}"></div>
                    </div>
                </div>
                <p th:replace="~{fragments/layout :: notice(#{cardUsage.partners.notice})}"></p>
            </th:block>

            <p th:replace="~{fragments/layout :: notice(#{cardUsage.notice(${usage.sampleSize()})})}"></p>
            <p class="notice"><span th:text="#{cardUsage.collectedAt}"></span>
                <time th:replace="~{fragments/layout :: localTime(${usage.collectedAt()})}"></time></p>
        </div>

        <!--/*
          このカードを使っているトッププレイヤーのうち、順位の高い人のデッキ。全員分はデッキ画面(カードで絞り込み)へつなぐ。
          誰も使っていないカードと、初回の集計が終わる前は出さない(使用率の欄に人数が出ているので、空の欄は置かない)。
        */-->
        <section class="card" id="top-decks" th:if="${topDecks != null and not #lists.isEmpty(topDecks)}">
            <h2 th:text="#{decks.heading.card(${card.name()})}"></h2>
            <p th:text="#{cardDecks.lead}"></p>
            <div class="top-deck top-deck-item" th:each="d : ${topDecks}">
                <th:block th:replace="~{fragments/layout :: topDeck(${d})}"></th:block>
            </div>
            <a class="btn btn-secondary card-action" th:if="${topDecksTotal > #lists.size(topDecks)}"
               th:href="@{/decks(card=${card.id()})}" th:text="#{cardDecks.all(${topDecksTotal})}"></a>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
