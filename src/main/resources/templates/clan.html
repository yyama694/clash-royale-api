<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>クラン情報</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; 検索に戻る</a>

        <div th:if="${error}" class="error-box" th:text="${error}"></div>

        <div th:if="${searchResults}" class="card">
            <h2>クラン名検索結果</h2>
            <p class="notice" th:if="${searchResultTotal > searchResults.size()}"
               th:text="'一致した' + ${searchResultTotal} + '件のうち、クランスコア上位' + ${searchResults.size()} + '件を表示しています。'"></p>
            <ul class="result-list">
                <li th:each="c : ${searchResults}">
                    <span class="name" th:text="${c.name()}"></span>
                    <span class="tag-pill" th:text="${c.tag()}"></span>
                    <span>クランスコア <span th:text="${c.clanScore()}"></span></span>
                    <span>メンバー <span th:text="${c.members()}"></span>人</span>
                    <a class="btn btn-secondary" th:href="@{/clan(tag=${c.tag()})}">見る</a>
                </li>
            </ul>
        </div>

        <div th:if="${clan}" class="card">
            <h1 th:text="${clan.name()}"></h1>
            <p><span class="tag-pill" th:text="${clan.tag()}"></span></p>
            <p th:if="${clan.description()}" th:text="${clan.description()}"></p>
            <ul class="stat-grid">
                <li><span class="label">🏆 クランスコア</span><span class="value" th:text="${clan.clanScore()}"></span></li>
                <li><span class="label">👥 メンバー数</span><span class="value" th:text="${clan.members()}"></span></li>
            </ul>
        </div>

        <div th:if="${clan}" class="card">
            <h2>メンバー一覧</h2>
            <p class="notice">※寄付数は今週分(毎週日曜0時(GMT)にリセット)の数値です。</p>
            <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>名前</th>
                        <th>役職</th>
                        <th>レベル</th>
                        <th>トロフィー</th>
                        <th>寄付数</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="member : ${clan.memberList()}">
                        <td><a th:href="@{/player(tag=${member.tag()})}" th:text="${member.name()}"></a></td>
                        <td th:text="${T(com.example.clashroyaleapi.web.RoleLabels).label(member.role(), #locale)}"></td>
                        <td th:text="${member.expLevel()}"></td>
                        <td th:text="${member.trophies()}"></td>
                        <td th:text="${member.donations()}"></td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
    </main>
</body>
</html>
