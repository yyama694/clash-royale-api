<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; <span th:text="#{action.backToTop}"></span></a>

        <div class="card">
            <div class="page-heading">
                <h1><bdi th:text="${playerName}"></bdi></h1>
                <span th:replace="~{fragments/layout :: favoriteButton('players', ${playerPathTag}, ${favorite}, ${favoriteLimit}, ${favoriteHint})}"></span>
            </div>
            <!--/* 所属クランは名前の次に気になる情報で、クラン情報画面への入口にもなるので、タグと並べて見出しのすぐ下に置く */-->
            <p class="profile-meta">
                <span class="tag-pill" th:text="${player.tag()}"></span>
                <a class="profile-clan" th:if="${player.clan()}" th:href="@{/clan/{tag}(tag=${clanPathTag})}">
                    <span aria-hidden="true">🛡️</span>
                    <span class="visually-hidden" th:text="#{player.clan}"></span>
                    <bdi th:text="${clanName}"></bdi>
                </a>
            </p>
            <p class="page-summary" th:text="${pageDescription}"></p>
            <div th:replace="~{fragments/layout :: shareButtons(#{share.player.text(${playerName})}, '/player/' + ${playerPathTag})}"></div>
            <!--/*
              強さが一目で分かる項目(トロフィー・ランク戦の順位・連勝連敗)は大きく出し、残りは小さく並べる。
              絵文字は見た目の目印なので、読み上げでは項目名だけが読まれるよう aria-hidden にする。
              ランク戦の成績は、上位の順位に入ったプレイヤーにしか意味のある値が無い(それ以外は順位なし・レーティング0)。
            */-->
            <ul class="stat-highlights">
                <li><span class="label"><span aria-hidden="true">🏆</span> <span th:text="#{player.trophies}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.trophies(), 1, 'DEFAULT')}"></span></li>
                <th:block th:with="r=${player.currentPathOfLegendSeasonResult()}"><li th:if="${r != null and r.rank() != null}"><span class="label"><span aria-hidden="true">🏅</span> <span th:text="#{player.ranked.current}"></span></span><span class="value" th:text="#{player.ranked.rank(${r.rank()})}"></span><span class="sub" th:text="#{player.ranked.rating(${r.trophies()})}"></span></li></th:block>
                <li th:if="${streak}"><span class="label"><span aria-hidden="true">🔥</span> <span th:text="#{player.streak}"></span></span><span class="value" th:text="${streak}"></span></li>
            </ul>
            <ul class="stat-grid stat-grid-compact">
                <li><span class="label"><span aria-hidden="true">⭐</span> <span th:text="#{player.kingTowerLevel}"></span></span><span class="value" th:text="${kingTowerLevel} ?: '-'"></span></li>
                <li><span class="label"><span aria-hidden="true">🥇</span> <span th:text="#{player.bestTrophies}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.bestTrophies(), 1, 'DEFAULT')}"></span></li>
                <li><span class="label"><span aria-hidden="true">⚔️</span> <span th:text="#{player.wins}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.wins(), 1, 'DEFAULT')}"></span></li>
                <li><span class="label"><span aria-hidden="true">❌</span> <span th:text="#{player.losses}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.losses(), 1, 'DEFAULT')}"></span></li>
                <li><span class="label"><span aria-hidden="true">👑</span> <span th:text="#{player.threeCrownWins}"></span></span><span class="value" th:text="${#numbers.formatInteger(player.threeCrownWins(), 1, 'DEFAULT')}"></span></li>
                <th:block th:with="r=${player.bestPathOfLegendSeasonResult()}"><li th:if="${r != null and r.rank() != null}"><span class="label"><span aria-hidden="true">🏅</span> <span th:text="#{player.ranked.best}"></span></span><span class="value" th:text="#{player.ranked.rank(${r.rank()})}"></span><span class="sub" th:text="#{player.ranked.rating(${r.trophies()})}"></span></li></th:block>
            </ul>
            <div class="card-notes" th:if="${streak}">
                <p th:replace="~{fragments/layout :: notice(#{player.streak.notice})}"></p>
            </div>
        </div>

        <div class="card current-deck">
            <h2 th:text="#{deck.heading}"></h2>
            <th:block th:if="${currentDeck}">
                <div th:replace="~{fragments/layout :: deckGrid(${currentDeck.cards()})}"></div>
                <th:block th:if="${not #lists.isEmpty(currentDeck.supportCards())}">
                    <div th:replace="~{fragments/layout :: supportCardRow(#{battle.supportCards}, ${currentDeck.supportCards()})}"></div>
                </th:block>
                <div th:replace="~{fragments/layout :: deckMeta(${currentDeck.meta()})}"></div>
                <div class="card-notes" th:if="${currentDeck.completedFromBattle()}">
                    <p th:replace="~{fragments/layout :: notice(#{deck.completed})}"></p>
                </div>
            </th:block>
            <p th:unless="${currentDeck}" class="empty-state" th:text="#{deck.empty}"></p>
        </div>

        <div th:if="${battleStats}" class="card">
            <h2 th:text="#{stats.heading}"></h2>
            <th:block th:if="${battleStats.total() > 0}">
                <p class="stats-summary">
                    <span th:text="#{stats.summary(${battleStats.total()}, ${battleStats.wins()}, ${battleStats.losses()})}"></span>
                    <span th:if="${battleStats.draws() > 0}" th:text="#{stats.draws(${battleStats.draws()})}"></span>
                </p>

                <div th:if="${battleStats.cardRanking()}">
                    <h3 th:text="#{stats.favorite.heading}"></h3>
                    <th:block th:unless="${#lists.isEmpty(battleStats.favoriteCards())}">
                        <div th:replace="~{fragments/layout :: performanceGrid(${battleStats.favoriteCards()}, 'good')}"></div>
                    </th:block>
                    <p th:if="${#lists.isEmpty(battleStats.favoriteCards())}" class="empty-state" th:text="#{stats.favorite.none}"></p>

                    <h3 th:text="#{stats.weak.heading}"></h3>
                    <th:block th:unless="${#lists.isEmpty(battleStats.weakCards())}">
                        <div th:replace="~{fragments/layout :: performanceGrid(${battleStats.weakCards()}, 'bad')}"></div>
                    </th:block>
                    <p th:if="${#lists.isEmpty(battleStats.weakCards())}" class="empty-state" th:text="#{stats.weak.none}"></p>
                </div>
                <p th:unless="${battleStats.cardRanking()}" class="empty-state" th:text="#{stats.insufficient}"></p>
            </th:block>
            <p th:if="${battleStats.total() == 0}" class="empty-state" th:text="#{stats.nothingCounted}"></p>
            <!--/* 集計の前提の説明は、結果を読んでから確かめられるよう末尾にまとめる */-->
            <div class="card-notes">
                <p th:replace="~{fragments/layout :: notice(#{stats.notice})}"></p>
                <th:block th:if="${battleStats.friendlyExcluded() > 0}">
                    <p th:replace="~{fragments/layout :: notice(#{stats.friendlyExcluded(${battleStats.friendlyExcluded()})})}"></p>
                </th:block>
                <th:block th:if="${battleStats.boatDefenseExcluded() > 0}">
                    <p th:replace="~{fragments/layout :: notice(#{stats.boatDefenseExcluded(${battleStats.boatDefenseExcluded()})})}"></p>
                </th:block>
                <th:block th:if="${battleStats.total() > 0 and battleStats.cardRanking()}">
                    <p th:replace="~{fragments/layout :: notice(#{stats.method})}"></p>
                </th:block>
            </div>
        </div>

        <div class="card">
            <h2 th:text="#{battlelog.heading}"></h2>
            <p th:if="${battleLogErrorKey}" class="error-box" th:text="#{${battleLogErrorKey}}"></p>
            <p th:if="${battles != null and #lists.isEmpty(battles)}" class="empty-state" th:text="#{battlelog.empty}"></p>
            <!--/*
              1戦を2行(対戦相手 / モード・日時)にまとめ、勝敗とクラウンは左端に縦に積む。表にするとスマホで1戦が6行になり、30戦で画面が非常に長くなっていた。
              勝敗は左端の色帯でも示し、連勝・連敗の流れを縦に見渡せるようにする。
            */-->
            <ol class="battle-list" th:if="${battles != null and not #lists.isEmpty(battles)}">
                <li class="battle-item" th:each="b : ${battles}" th:classappend="'battle-' + ${b.result().code()}">
                    <div class="battle-result">
                        <span th:replace="~{fragments/layout :: resultBadge(${b.result()})}"></span>
                        <span class="battle-crowns">
                            <span class="visually-hidden" th:text="#{battlelog.col.crowns}"></span>
                            <span th:text="${b.selfCrowns()} + ' - ' + ${b.opponentCrowns()}"></span>
                        </span>
                    </div>
                    <div class="battle-body">
                        <!--/* 2v2では相手が2人いて味方もいるため、全員を出す(相手の1人目だけだと対戦の半分しか分からない) */-->
                        <div class="battle-opponents">
                            <span class="visually-hidden" th:text="#{battlelog.col.opponent}"></span>
                            <span class="name-list">
                                <span th:each="o : ${b.opponents()}"><a th:href="@{/player/{tag}(tag=${o.pathTag()})}"><bdi th:text="${o.name()}"></bdi></a>
                                    <span th:if="${o.averageLevel() != null}" class="opponent-level"
                                          th:text="#{battlelog.averageLevel(${#numbers.formatDecimal(o.averageLevel(), 1, 1)})}"></span></span>
                            </span>
                        </div>
                        <div class="battle-sub">
                            <span th:text="${b.gameMode()}"></span>
                            <time th:replace="~{fragments/layout :: localTime(${b.time()})}"></time>
                            <span th:unless="${#lists.isEmpty(b.teammates())}" class="teammates">
                                <span th:text="#{battlelog.teammate}"></span>
                                <span class="name-list">
                                    <a th:each="t : ${b.teammates()}" th:href="@{/player/{tag}(tag=${t.pathTag()})}"><bdi th:text="${t.name()}"></bdi></a>
                                </span>
                            </span>
                        </div>
                    </div>
                    <a class="btn btn-secondary btn-small battle-detail" th:href="@{/player/{tag}/battles/{time}(tag=${playerPathTag},time=${b.battleTime()})}"><span class="battle-detail-label" th:text="#{action.detail}"></span></a>
                </li>
            </ol>
            <div class="card-notes">
                <p th:replace="~{fragments/layout :: notice(#{battlelog.notice})}"></p>
            </div>
        </div>

        <!--/*
          育成途中のプレイヤーには「最大レベル 0/29枚(0%)」が並ぶだけになりやすいので、デッキ・戦績・対戦履歴の後ろに置く。
        */-->
        <div th:if="${cardCollection}" class="card">
            <h2 th:text="#{cardCollection.heading}"></h2>
            <p th:replace="~{fragments/layout :: notice(#{cardCollection.notice(${cardCollection.maxedPercent()})})}"></p>
            <!--/* 割合は文言で読めるので、バーは見た目の補助として読み上げから外す */-->
            <ul class="collection-list">
                <li th:each="r : ${cardCollection.rarities()}">
                    <div class="collection-head">
                        <span class="collection-rarity" th:text="${r.rarityLabel()}"></span>
                        <span class="collection-count" th:text="#{cardCollection.rarity.value(${r.maxedCards()}, ${r.totalCards()}, ${r.maxedPercent()})}"></span>
                    </div>
                    <div class="progress" aria-hidden="true"><span th:style="'--percent: ' + ${r.maxedPercent()} + '%'"></span></div>
                </li>
            </ul>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
