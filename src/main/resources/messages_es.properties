# Etiquetas en español.
# Las claves card.* / gamemode.* son los nombres en inglés que devuelve la API oficial.
# Las claves que falten usan el nombre en inglés, así que no hace falta tocar código al salir una carta nueva.
# Según el formato .properties, los espacios de las claves van escapados con una barra invertida.
# Los términos del juego (nombres de cartas, roles, calidad, modos) siguen el texto oficial del juego y del blog de Supercell.

