about.intro=Princess Tower è un sito non ufficiale creato da un fan per i giocatori di Clash Royale di tutto il mondo. Usa l'API ufficiale di Clash Royale fornita da Supercell per mostrare le informazioni su giocatori e clan, le classifiche, il tasso di utilizzo delle carte e i mazzi dei migliori giocatori.
about.operator.heading=Chi gestisce il sito
about.operator.body=Il sito è gestito da un privato in Giappone come progetto personale. Non è gestito da un'azienda e non ha alcun legame con Supercell.
about.data.heading=Informazioni sui dati
about.data.body=Tutti i dati del gioco provengono dall'API ufficiale. Le informazioni su giocatori e clan vengono aggiornate ogni pochi minuti, mentre i mazzi dei migliori giocatori e il tasso di utilizzo delle carte vengono raccolti una volta al giorno. Se qualcosa non ti sembra corretto, faccelo sapere.
about.contact.heading=Contatti
about.contact.body=Per segnalare errori, proporre nuove funzioni o chiedere la rimozione delle tue informazioni di giocatore, invia un messaggio diretto su X:
about.privacy=Per sapere come il sito tratta le informazioni, consulta l'Informativa sulla privacy:
