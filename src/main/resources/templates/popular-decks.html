<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:href="@{/decks(lang=${#locale.language})}">&laquo; <span th:text="#{decks.pageTitle}"></span></a>

        <div class="card">
            <h1 th:text="${heading}"></h1>
            <p th:text="#{decks.popular.lead}"></p>
            <form th:replace="~{fragments/layout :: deckFilter('/decks/popular')}"></form>
            <th:block th:if="${popularDecks != null}">
                <th:block th:if="${seasonNotice != null}">
                    <p th:replace="~{fragments/layout :: notice(${seasonNotice})}"></p>
                </th:block>
                <p th:replace="~{fragments/layout :: notice(#{decks.notice})}"></p>
                <p class="notice"><span th:text="#{cardUsage.collectedAt}"></span>
                    <time th:replace="~{fragments/layout :: localTime(${collectedAt})}"></time></p>
            </th:block>
            <p class="popular-decks-link">
                <a th:href="${#lists.isEmpty(selectedCards)} ? @{/decks(lang=${#locale.language})}
                           : @{/decks(card=${selectedCards},lang=${#locale.language})}"
                   th:text="#{decks.popular.byRank}"></a></p>
            <p class="popular-decks-link">
                <a th:href="@{/decks/win-rates(lang=${#locale.language})}" th:text="#{decks.winRate.open}"></a></p>
            <p th:if="${popularDecks == null}" class="empty-state" th:text="#{decks.notCollected}"></p>
            <p th:if="${popularDecks != null and #lists.isEmpty(popularDecks)}" class="empty-state"
               th:text="#{decks.popular.empty}"></p>
        </div>

        <!--/*
          レベルは人ごとに違うので出さない。カードの形とタワーユニットは、使っている人のうち最上位の人のもの。
        */-->
        <th:block th:if="${popularDecks != null and not #lists.isEmpty(popularDecks)}">
            <p class="pager-range" th:text="#{decks.popular.range(${from}, ${to}, ${total})}"></p>
            <div class="card top-deck popular-deck" th:each="p : ${popularDecks}">
                <div class="top-deck-head">
                    <span class="top-deck-rank" th:text="#{decks.popular.players(${p.players()})}"></span>
                    <span class="top-deck-rating"><span th:text="#{decks.popular.best(${p.topRank()})}"></span>
                        <a th:href="@{/player/{tag}(tag=${p.topPathTag()},lang=${#locale.language})}"><bdi th:text="${p.topName()}"></bdi></a></span>
                </div>
                <div th:replace="~{fragments/layout :: deckGrid(${p.cards()})}"></div>
                <th:block th:if="${not #lists.isEmpty(p.supportCards())}">
                    <div th:replace="~{fragments/layout :: supportCardRow(#{battle.supportCards}, ${p.supportCards()})}"></div>
                </th:block>
                <div th:replace="~{fragments/layout :: deckMeta(${p.meta()})}"></div>
                <a class="popular-deck-link" th:href="@{/decks(card=${p.cardIds()},lang=${#locale.language})}"
                   th:text="#{decks.popular.link(${p.players()})}"></a>
            </div>
            <nav class="pager" th:if="${prevPage != null or nextPage != null}">
                <a class="btn btn-secondary" th:if="${prevPage != null}"
                   th:href="${#lists.isEmpty(selectedCards)} ? @{/decks/popular(page=${prevPage},lang=${#locale.language})}
                           : @{/decks/popular(card=${selectedCards},page=${prevPage},lang=${#locale.language})}"
                   th:text="#{decks.popular.prev}"></a>
                <span class="pager-range" th:text="#{decks.popular.range(${from}, ${to}, ${total})}"></span>
                <a class="btn btn-secondary" th:if="${nextPage != null}"
                   th:href="${#lists.isEmpty(selectedCards)} ? @{/decks/popular(page=${nextPage},lang=${#locale.language})}
                           : @{/decks/popular(card=${selectedCards},page=${nextPage},lang=${#locale.language})}"
                   th:text="#{decks.popular.next}"></a>
            </nav>
        </th:block>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
