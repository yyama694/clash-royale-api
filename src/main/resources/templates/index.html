<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{home.pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container" data-favorites-tracked>
        <!--/* 初めて来た人に何のサイトかが伝わるよう、ページの見出しと説明を検索フォームの前に置く */-->
        <div class="page-intro">
            <h1 th:text="#{home.heading}"></h1>
            <p th:text="#{app.description}"></p>
        </div>

        <div th:replace="~{fragments/layout :: playerSearchForm(null)}"></div>
        <div th:replace="~{fragments/layout :: clanSearchForm(null)}"></div>

        <!--/*
          お気に入りは名前だけ(公式APIは呼ばない)。1件も無いときはカードごと出さない
          (初めての訪問者に空の枠を見せないため。登録方法の案内はお気に入り画面が受け持つ)。
        */-->
        <div class="card" id="favorites-card"
             th:if="${not #lists.isEmpty(favoritePlayers) or not #lists.isEmpty(favoriteClans)}">
            <h2 th:text="#{favorites.heading}"></h2>
            <div class="favorite-chip-row" th:if="${not #lists.isEmpty(favoritePlayers)}">
                <span class="favorite-chip-label" th:text="#{favorites.players}"></span>
                <a class="favorite-chip" th:each="p : ${favoritePlayers}"
                   th:href="@{/player/{tag}(tag=${p.tag()})}"><bdi th:text="${p.name()}"></bdi></a>
            </div>
            <div class="favorite-chip-row" th:if="${not #lists.isEmpty(favoriteClans)}">
                <span class="favorite-chip-label" th:text="#{favorites.clans}"></span>
                <a class="favorite-chip" th:each="c : ${favoriteClans}"
                   th:href="@{/clan/{tag}(tag=${c.tag()})}"><bdi th:text="${c.name()}"></bdi></a>
            </div>
            <a class="btn btn-secondary card-action" th:href="@{/favorites}" th:text="#{favorites.link}"></a>
        </div>

        <div class="card" id="player-ranking">
            <h2 th:text="#{playerRanking.heading}"></h2>
            <p th:text="#{playerRanking.lead(${playerRankingSize})}"></p>
            <!--/* 国を選び直すとページ先頭に戻ってしまうため、送信先にアンカーを付けてランキングの位置に戻す */-->
            <div th:replace="~{fragments/layout :: rankingTabs(
                     ~{fragments/layout :: playerRankingTable(${globalRanking}, false, null)},
                     ~{fragments/layout :: playerRankingTable(${localRanking}, false, null)},
                     '/#player-ranking', null)}"></div>
            <a class="btn btn-secondary card-action" th:href="@{/ranking/players}" th:text="#{playerRanking.link}"></a>
        </div>

        <div class="card">
            <h2 th:text="#{ranking.heading}"></h2>
            <p th:text="#{ranking.lead}"></p>
            <a class="btn btn-secondary" th:href="@{/ranking}" th:text="#{ranking.link}"></a>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
