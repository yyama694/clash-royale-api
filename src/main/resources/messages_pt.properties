about.data.heading=Sobre os dados
about.data.body=Todos os dados do jogo vêm da API oficial. As informações de jogadores e clãs são atualizadas a cada poucos minutos, e os decks dos melhores jogadores e o uso das cartas são coletados uma vez por dia. Se algo parecer errado, avise-nos.
