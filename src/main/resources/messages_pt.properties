about.intro=Princess Tower é um site não oficial feito por fãs para jogadores de Clash Royale do mundo todo. Ele usa a API oficial do Clash Royale fornecida pela Supercell para mostrar informações de jogadores e clãs, rankings, o uso das cartas e os decks dos melhores jogadores.
