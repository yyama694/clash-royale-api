<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>名前検索</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; 検索に戻る</a>

        <div class="card">
            <h1>名前検索</h1>
            <p class="notice">過去にプレイヤー検索・クラン検索で表示された名前の中から部分一致で検索します。<br>
               まだ検索されたことのない名前はヒットしません。</p>

            <form class="search-form" th:action="@{/search}" method="get">
                <label>プレイヤー名/クランメンバー名
                    <input type="text" name="name" th:value="${query}">
                </label>
                <button type="submit">検索</button>
            </form>
        </div>

        <div th:if="${results != null}" class="card">
            <p th:if="${#lists.isEmpty(results)}" class="empty-state">該当する名前が見つかりませんでした。</p>
            <ul class="result-list" th:unless="${#lists.isEmpty(results)}">
                <li th:each="r : ${results}">
                    <span class="name" th:text="${r.name()}"></span>
                    <span class="tag-pill" th:text="${r.tag()}"></span>
                    <a class="btn btn-secondary" th:href="@{/player(tag=${r.tag()})}">プレイヤーとして見る</a>
                    <a class="btn btn-secondary" th:href="@{/clan(tag=${r.tag()})}">クランとして見る</a>
                </li>
            </ul>
        </div>
    </main>
</body>
</html>
