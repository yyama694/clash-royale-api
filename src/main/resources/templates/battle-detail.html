<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{battle.pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container container-wide">
        <a class="back-link" th:href="@{/player/{tag}(tag=${playerPathTag})}">&laquo; <span th:text="#{action.backToPlayer}"></span></a>

        <div class="card">
            <h1 th:text="#{battle.pageTitle}"></h1>
            <p class="notice" th:text="${battle.battleTime()} + ' / ' + ${battle.gameMode()}"></p>

            <div class="matchup">
                <div th:replace="~{fragments/layout :: matchupSide(${battle.team()})}"></div>
                <div class="vs" th:text="#{battle.vs}"></div>
                <div th:replace="~{fragments/layout :: matchupSide(${battle.opponents()})}"></div>
            </div>
        </div>

        <!-- 自分側と相手側を左右に並べ、デッキを見比べられるようにする。2v2では各側が縦に2枚並ぶ。 -->
        <div class="decks">
            <div class="decks-side">
                <div class="card deck-panel" th:each="p : ${battle.team()}">
                    <h2 th:text="#{battle.deck.team} + '(' + ${p.name()} + ')'"></h2>
                    <div th:replace="~{fragments/layout :: deckGrid(${p.cards()})}"></div>
                    <th:block th:if="${not #lists.isEmpty(p.supportCards())}">
                        <div th:replace="~{fragments/layout :: supportCardRow(#{battle.supportCards}, ${p.supportCards()})}"></div>
                    </th:block>
                </div>
            </div>

            <div class="decks-side">
                <div class="card deck-panel" th:each="p : ${battle.opponents()}">
                    <h2 th:text="#{battle.deck.opponent} + '(' + ${p.name()} + ')'"></h2>
                    <div th:replace="~{fragments/layout :: deckGrid(${p.cards()})}"></div>
                    <th:block th:if="${not #lists.isEmpty(p.supportCards())}">
                        <div th:replace="~{fragments/layout :: supportCardRow(#{battle.supportCards}, ${p.supportCards()})}"></div>
                    </th:block>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
