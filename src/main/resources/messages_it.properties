# Etichette in italiano.
# Le chiavi card.* / gamemode.* corrispondono ai nomi inglesi restituiti dall'API ufficiale.
# Le chiavi mancanti usano il nome inglese, quindi l'uscita di una nuova carta non richiede modifiche al codice.
# Nel formato .properties, gli spazi nelle chiavi sono preceduti da una barra rovesciata.
# I termini di gioco (nomi delle carte, ruoli, qualità, modalità) seguono il testo ufficiale del gioco e il blog di Supercell.

