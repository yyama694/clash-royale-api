<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>プレイヤー情報</title>
</head>
<body>
    <p><a th:href="@{/}">&laquo; 検索に戻る</a></p>

    <div th:if="${error}">
        <p th:text="${error}" style="color:red;"></p>
    </div>

    <div th:if="${player}">
        <h1 th:text="${player.name()}"></h1>
        <p>タグ: <span th:text="${player.tag()}"></span></p>
        <ul>
            <li>経験値レベル: <span th:text="${player.expLevel()}"></span></li>
            <li>現在トロフィー: <span th:text="${player.trophies()}"></span></li>
            <li>ベストトロフィー: <span th:text="${player.bestTrophies()}"></span></li>
            <li>勝利数: <span th:text="${player.wins()}"></span></li>
            <li>敗北数: <span th:text="${player.losses()}"></span></li>
            <li>3クラウン勝利数: <span th:text="${player.threeCrownWins()}"></span></li>
            <li th:if="${player.clan()}">所属クラン: <span th:text="${player.clan().name()}"></span></li>
        </ul>
    </div>

    <div th:if="${player}">
        <h2>直近の対戦履歴</h2>
        <p>※Clash Royale公式APIの仕様上、直近の対戦履歴は最大25件程度までしか取得できません(件数指定不可)。</p>
        <p th:if="${battleLogError}" th:text="${battleLogError}" style="color:red;"></p>
        <p th:if="${battleLog != null and #lists.isEmpty(battleLog)}">対戦履歴がありません。</p>
        <table th:if="${battleLog != null and not #lists.isEmpty(battleLog)}" border="1" cellpadding="4">
            <thead>
                <tr>
                    <th>日時</th>
                    <th>モード</th>
                    <th>結果</th>
                    <th>クラウン(自分/相手)</th>
                    <th>対戦相手</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="b : ${battleLog}">
                    <td th:text="${b.battleTime()}"></td>
                    <td th:text="${b.gameMode() != null ? b.gameMode().name() : '-'}"></td>
                    <td th:text="${b.team()[0].crowns() > b.opponent()[0].crowns()} ? '勝ち' : (${b.team()[0].crowns() < b.opponent()[0].crowns()} ? '負け' : '引き分け')"></td>
                    <td th:text="${b.team()[0].crowns()} + ' / ' + ${b.opponent()[0].crowns()}"></td>
                    <td th:text="${b.opponent()[0].name()}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
