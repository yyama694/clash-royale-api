<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <a class="back-link" th:unless="${single}" th:href="@{/cards}">&laquo; <span th:text="#{action.backToCards}"></span></a>
        <a class="back-link" th:if="${single}" th:href="@{/balance}">&laquo; <span th:text="#{balance.all}"></span></a>

        <div class="card">
            <h1 th:text="${single} ? ${updates[0].heading()} : #{balance.heading}"></h1>
            <p th:text="#{balance.lead}"></p>
        </div>

        <section class="card" th:each="u : ${updates}" th:id="${u.anchor()}">
            <h2 th:unless="${single}"><a th:href="@{/balance/{d}(d=${u.anchor()})}" th:text="${u.heading()}"></a></h2>
            <p><a th:href="${u.sourceUrl()}" rel="noopener" th:text="${u.sourceLabel()}"></a></p>
            <ul class="balance-digest" th:unless="${#lists.isEmpty(u.digests())}">
                <li th:each="d : ${u.digests()}" th:text="${d}"></li>
            </ul>
            <th:block th:each="g : ${u.groups()}">
                <h3 th:text="${g.label()}"></h3>
                <ul class="balance-list">
                    <th:block th:each="c : ${g.cards()}">
                        <li th:replace="~{fragments/layout :: balanceChange(${c}, null, null)}"></li>
                    </th:block>
                </ul>
            </th:block>
            <th:block th:if="${u.nowSampleSize() != null and u.baselineDate() != null}">
                <p th:replace="~{fragments/layout :: notice(#{balance.usage.notice(${u.baselineDate()}, ${u.baselineSampleSize()}, ${u.nowSampleSize()})})}"></p>
            </th:block>
            <th:block th:if="${u.nowSampleSize() != null and u.baselineDate() == null}">
                <p th:replace="~{fragments/layout :: notice(#{balance.usage.noticeNow(${u.nowSampleSize()})})}"></p>
            </th:block>
            <th:block th:if="${u.showDaysNotice()}">
                <p th:replace="~{fragments/layout :: notice(#{balance.usage.noticeDays})}"></p>
            </th:block>
            <th:block th:if="${u.showNextNotice()}">
                <p th:replace="~{fragments/layout :: notice(#{balance.usage.noticeNext})}"></p>
            </th:block>
            <th:block th:if="${u.showFormNotice()}">
                <p th:replace="~{fragments/layout :: notice(#{balance.usage.formNotice})}"></p>
            </th:block>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
