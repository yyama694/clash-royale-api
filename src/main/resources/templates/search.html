<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>名前検索</title>
</head>
<body>
    <p><a th:href="@{/}">&laquo; 検索に戻る</a></p>

    <h1>名前検索</h1>
    <p>過去にプレイヤー検索・クラン検索で表示された名前の中から部分一致で検索します。<br>
       まだ検索されたことのない名前はヒットしません。</p>

    <form th:action="@{/search}" method="get">
        <label>プレイヤー名/クランメンバー名: <input type="text" name="name" th:value="${query}"></label>
        <button type="submit">検索</button>
    </form>

    <div th:if="${results != null}">
        <p th:if="${#lists.isEmpty(results)}">該当する名前が見つかりませんでした。</p>
        <ul th:unless="${#lists.isEmpty(results)}">
            <li th:each="r : ${results}">
                <span th:text="${r.name()}"></span>
                (<span th:text="${r.tag()}"></span>)
                <a th:href="@{/player(tag=${r.tag()})}">プレイヤーとして見る</a>
                <a th:href="@{/clan(tag=${r.tag()})}">クランとして見る</a>
            </li>
        </ul>
    </div>
</body>
</html>
