about.intro=Princess Tower est un site non officiel créé par un fan pour les joueurs de Clash Royale du monde entier. Il utilise l'API officielle de Clash Royale fournie par Supercell pour afficher les informations des joueurs et des clans, les classements, les taux d'utilisation des cartes et les decks des meilleurs joueurs.
about.operator.heading=Qui gère ce site
about.operator.body=Ce site est géré par un particulier au Japon, à titre personnel. Il n'est pas géré par une entreprise et n'a aucun lien avec Supercell.
about.data.heading=À propos des données
about.data.body=Toutes les données du jeu proviennent de l'API officielle. Les informations des joueurs et des clans sont actualisées régulièrement, à quelques minutes d'intervalle, et les decks des meilleurs joueurs ainsi que les taux d'utilisation des cartes sont collectés une fois par jour. Si quelque chose vous semble incorrect, n'hésitez pas à nous le signaler.
about.contact.heading=Contact
about.contact.body=Pour signaler un bug, proposer une nouvelle fonctionnalité ou demander la suppression de vos informations de joueur, envoyez un message privé sur X :
about.privacy=La manière dont ce site traite les informations est expliquée dans la politique de confidentialité :
