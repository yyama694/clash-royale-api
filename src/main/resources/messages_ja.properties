# 日本語ラベル。
# card.* / gamemode.* は公式APIが返す英語名がそのままキーになる。
# 未登録のキーはコード側で英語名にフォールバックするため、新カード追加時もコード変更は不要。
# .properties の仕様上、キーに含まれる空白はバックスラッシュでエスケープしている。

