<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>プレイヤー情報</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <a class="back-link" th:href="@{/}">&laquo; 検索に戻る</a>

        <div th:if="${error}" class="error-box" th:text="${error}"></div>

        <div th:if="${player}" class="card">
            <h1 th:text="${player.name()}"></h1>
            <p><span class="tag-pill" th:text="${player.tag()}"></span></p>
            <ul class="stat-grid">
                <li><span class="label">経験値レベル</span><span class="value" th:text="${player.expLevel()}"></span></li>
                <li><span class="label">現在トロフィー</span><span class="value" th:text="${player.trophies()}"></span></li>
                <li><span class="label">ベストトロフィー</span><span class="value" th:text="${player.bestTrophies()}"></span></li>
                <li><span class="label">勝利数</span><span class="value" th:text="${player.wins()}"></span></li>
                <li><span class="label">敗北数</span><span class="value" th:text="${player.losses()}"></span></li>
                <li><span class="label">3クラウン勝利数</span><span class="value" th:text="${player.threeCrownWins()}"></span></li>
                <li th:if="${player.clan()}"><span class="label">所属クラン</span><span class="value" th:text="${player.clan().name()}"></span></li>
            </ul>
        </div>

        <div th:if="${player}" class="card">
            <h2>直近の対戦履歴</h2>
            <p class="notice">※Clash Royale公式APIの仕様上、直近の対戦履歴は最大25件程度までしか取得できません(件数指定不可)。</p>
            <p th:if="${battleLogError}" class="error-box" th:text="${battleLogError}"></p>
            <p th:if="${battleLog != null and #lists.isEmpty(battleLog)}" class="empty-state">対戦履歴がありません。</p>
            <table th:if="${battleLog != null and not #lists.isEmpty(battleLog)}">
                <thead>
                    <tr>
                        <th>日時</th>
                        <th>モード</th>
                        <th>結果</th>
                        <th>クラウン(自分/相手)</th>
                        <th>対戦相手</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${battleLog}">
                        <td th:text="${b.battleTime()}"></td>
                        <td th:text="${b.gameMode() != null ? b.gameMode().name() : '-'}"></td>
                        <td>
                            <span th:if="${b.team()[0].crowns() > b.opponent()[0].crowns()}" class="badge badge-win">勝ち</span>
                            <span th:if="${b.team()[0].crowns() < b.opponent()[0].crowns()}" class="badge badge-lose">負け</span>
                            <span th:if="${b.team()[0].crowns() == b.opponent()[0].crowns()}" class="badge badge-draw">引き分け</span>
                        </td>
                        <td th:text="${b.team()[0].crowns()} + ' / ' + ${b.opponent()[0].crowns()}"></td>
                        <td th:text="${b.opponent()[0].name()}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
